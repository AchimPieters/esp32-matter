<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>esp32-matter — Product Wizard</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #e2e6ec;
    --bg: #f6f7f9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --card-bg: #ffffff;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header.topbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.topbar .logo {
    font-weight: 700;
    font-size: 16px;
  }

  header.topbar .logo span {
    color: var(--blue);
  }

  header.topbar .tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin-left: 4px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- Dashboard ---------- */

  .dashboard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .dashboard-head h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }

  .dashboard-head p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button.primary:hover { background: var(--blue-dark); }

  button.primary:disabled {
    background: #b9c2d0;
    cursor: not-allowed;
  }

  button.secondary {
    background: #fff;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary:hover { background: #eef3ff; }

  button.link {
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
  }

  .product-card:hover { border-color: var(--blue); }

  .product-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .product-card .meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
  }

  /* ---------- Setup screen ---------- */

  .setup-wrap {
    max-width: 480px;
    margin: 60px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
  }

  .setup-wrap h2 {
    margin: 0 0 6px;
    font-size: 20px;
  }

  .setup-wrap p.hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-error {
    color: #c0392b;
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 16px;
  }

  .setup-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  /* ---------- Wizard stepper ---------- */

  .stepper {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 24px;
    margin-bottom: 28px;
    overflow-x: auto;
    gap: 4px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }

  .step .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d7dce3;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step.done .dot { background: var(--blue); }
  .step.active .dot { background: var(--blue); }
  .step.active { color: var(--blue); }

  .step-sep {
    color: #c6cbd4;
    margin: 0 6px;
  }

  .wizard-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
  }

  .wizard-panel h2 {
    margin: 0 0 8px;
  }

  .wizard-panel p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 460px;
    margin: 0 auto 24px;
  }

  .badge-soon {
    display: inline-block;
    background: #eef3ff;
    color: var(--blue);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }

  .wizard-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }

  /* ---------- Wizard step content (Get Started / Select Module) ---------- */

  .step-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  .step-panel h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }

  .step-panel > p.step-hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .option-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
  }

  .option-card:hover { border-color: var(--blue); }

  .option-card.selected {
    border-color: var(--blue);
    background: #f5f8ff;
  }

  .option-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .option-card .desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 10px;
    min-height: 32px;
  }

  .badge-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .conn-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef1f6;
    color: var(--text-muted);
  }

  .conn-badge.wifi { background: #e6f4ff; color: #0b6bcb; }
  .conn-badge.ble { background: #eef0ff; color: #4338ca; }
  .conn-badge.thread { background: #e9f9ee; color: #1a7f37; }

  .option-card.selected .conn-badge {
    background: #ffffff;
  }

  .note-box {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .note-box code {
    background: #eef1f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ---------- Configure Device ---------- */

  .configure-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 720px) {
    .configure-grid { grid-template-columns: 1fr; }
  }

  .driver-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 4px;
  }

  .driver-block h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  input[type="number"] {
    width: 100%;
    max-width: 200px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }

  .config-sidebar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .config-sidebar h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .summary-row {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .summary-row:first-of-type { border-top: none; }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .summary-value {
    font-size: 14px;
    font-weight: 600;
  }

  .summary-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---------- Test Product ---------- */

  .warn-box {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #f3caca;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .serial-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .serial-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .serial-controls select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }

  .status-dot {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: auto;
  }

  .status-dot.connected { color: #1a7f37; }

  .serial-log {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    border-radius: 8px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  .option-card.disabled {
    cursor: not-allowed;
    opacity: 0.55;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">esp32-<span>matter</span></div>
  <div class="tagline">Product Wizard — local, offline, no cloud</div>
</header>

<main id="app"></main>

<script>
/*
 * Plain client-side state machine, no build step, no external dependencies.
 * Product data lives only in the browser's localStorage — nothing is sent
 * anywhere. This is the first two screens of the wizard (dashboard + setup);
 * later steps (Select Module, Configure Device, ...) are stubbed on purpose
 * so they can be filled in incrementally.
 */

const STORAGE_KEY = "esp32matter.products";

const WIZARD_STEPS = [
  "Get Started",
  "Select Module",
  "Configure Device",
  "Test Product",
  "Customise & Review",
  "Generate Firmware",
];

/* Device types this repo actually has firmware for (see firmware/).
 * Only one today — copy firmware/light/ to add more, per CLAUDE.md. */
const DEVICE_TYPES = [
  {
    id: "light",
    name: "On/Off Light",
    desc: "Matter on/off light, driven by a single digital GPIO. Reference device in firmware/light/.",
  },
];

/* Reasonable default LED GPIO per module, echoing the comment in
 * firmware/light/main/app_main.cpp ("GPIO 2 is common on classic ESP32
 * devkits; ESP32-C6 devkits often use GPIO 8") — always adjustable, since
 * it genuinely depends on the board. */
const DEFAULT_LED_GPIO = {
  esp32: 2,
  esp32c3: 8,
  esp32c6: 8,
  esp32s3: 2,
  esp32h2: 8,
};

/* Chips this repo's Docker dev flow (tools/dev.sh) targets via
 * `idf.py set-target <chip>`. Connectivity reflects the actual radios on
 * each chip, not marketing copy — ESP32-H2 has no Wi-Fi, for example. */
const MODULES = [
  {
    id: "esp32",
    name: "ESP32 (WROOM-32)",
    desc: "Classic dual-core ESP32 — the default target for this repo.",
    conn: ["wifi", "ble"],
  },
  {
    id: "esp32c3",
    name: "ESP32-C3",
    desc: "Single-core RISC-V, compact and low-cost.",
    conn: ["wifi", "ble"],
  },
  {
    id: "esp32c6",
    name: "ESP32-C6",
    desc: "Wi-Fi 6 plus 802.15.4 — can run Matter over Thread.",
    conn: ["wifi", "ble", "thread"],
  },
  {
    id: "esp32s3",
    name: "ESP32-S3",
    desc: "Dual-core with more RAM/flash headroom.",
    conn: ["wifi", "ble"],
  },
  {
    id: "esp32h2",
    name: "ESP32-H2",
    desc: "802.15.4 (Thread/Zigbee) only — no Wi-Fi. Needs a Thread border router.",
    conn: ["ble", "thread"],
  },
];

const state = {
  screen: "dashboard", // "dashboard" | "setup" | "wizard"
  products: loadProducts(),
  currentProduct: null,
};

function loadProducts() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveProducts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.products));
}

function goTo(screen) {
  state.screen = screen;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "dashboard") app.innerHTML = renderDashboard();
  else if (state.screen === "setup") app.innerHTML = renderSetup();
  else if (state.screen === "wizard") app.innerHTML = renderWizard();
  bindEvents();
}

/* ---------- Dashboard ---------- */

function renderDashboard() {
  const cards = state.products
    .map(
      (p) => `
      <div class="product-card" data-open-product="${p.id}">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="meta">
          ${moduleName(p.target) !== "—" ? escapeHtml(moduleName(p.target)) + " · " : ""}Step: ${WIZARD_STEPS[p.step]}
        </div>
      </div>`
    )
    .join("");

  const grid = state.products.length
    ? `<div class="product-grid">${cards}</div>`
    : `<div class="empty-state">No products yet. Create your first one to get started.</div>`;

  return `
    <div class="dashboard-head">
      <div>
        <h1>Your products</h1>
        <p>Configure Matter devices for the esp32-matter toolkit — everything stays on this machine.</p>
      </div>
      <button class="primary" id="create-product-btn">+ Create a new product</button>
    </div>
    ${grid}
  `;
}

/* ---------- Setup your product ---------- */

function renderSetup() {
  return `
    <div class="setup-wrap">
      <h2>Setup your product</h2>
      <p class="hint">Give your product a name. You can change it later.</p>

      <label class="field-label" for="product-name">Product name</label>
      <input type="text" id="product-name" placeholder="e.g. Living Room Light" autocomplete="off">
      <div class="field-error" id="product-name-error"></div>

      <div class="setup-actions">
        <button class="link" id="setup-cancel-btn">&larr; Cancel</button>
        <button class="primary" id="setup-start-btn" disabled>Start</button>
      </div>
    </div>
  `;
}

/* ---------- Wizard shell ---------- */

const CONN_LABELS = { wifi: "Wi-Fi", ble: "BLE", thread: "Thread" };

function renderWizard() {
  const p = state.currentProduct;
  const stepsHtml = WIZARD_STEPS.map((label, i) => {
    const cls = i < p.step ? "done" : i === p.step ? "active" : "";
    const marker = i < p.step ? "&#10003;" : i + 1;
    const sep = i < WIZARD_STEPS.length - 1 ? `<span class="step-sep">&rsaquo;</span>` : "";
    return `<div class="step ${cls}"><span class="dot">${marker}</span>${escapeHtml(label)}</div>${sep}`;
  }).join("");

  let content;
  if (p.step === 0) content = renderGetStarted(p);
  else if (p.step === 1) content = renderSelectModule(p);
  else if (p.step === 2) content = renderConfigureDevice(p);
  else if (p.step === 3) content = renderTestProduct(p);
  else content = renderStubStep(p);

  return `<div class="stepper">${stepsHtml}</div>${content}`;
}

function renderGetStarted(p) {
  // Auto-select the only device type there is today — future types will
  // require an explicit click once DEVICE_TYPES has more than one entry.
  if (!p.deviceType && DEVICE_TYPES.length === 1) p.deviceType = DEVICE_TYPES[0].id;

  const cards = DEVICE_TYPES.map((d) => {
    const selected = p.deviceType === d.id;
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-device-type="${d.id}">
        <h3>${escapeHtml(d.name)}</h3>
        <p class="desc">${escapeHtml(d.desc)}</p>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose your device</h2>
      <p class="step-hint">What kind of Matter device is "${escapeHtml(p.name)}"?</p>
      <div class="option-grid">${cards}</div>
      <p class="note-box">
        Only the On/Off Light is implemented so far. Adding a switch or
        temperature sensor is an open next step — see CLAUDE.md.
      </p>
      ${renderWizardFooter(p, !!p.deviceType)}
    </div>
  `;
}

function renderSelectModule(p) {
  const cards = MODULES.map((m) => {
    const selected = p.target === m.id;
    const badges = m.conn
      .map((c) => `<span class="conn-badge ${c}">${CONN_LABELS[c]}</span>`)
      .join("");
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-module="${m.id}">
        <h3>${escapeHtml(m.name)}</h3>
        <p class="desc">${escapeHtml(m.desc)}</p>
        <div class="badge-row">${badges}</div>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose an ESP module</h2>
      <p class="step-hint">Which chip will "${escapeHtml(p.name)}" run on? This maps to <code>idf.py set-target</code>.</p>
      <div class="option-grid">${cards}</div>
      ${renderWizardFooter(p, !!p.target)}
    </div>
  `;
}

function renderConfigureDevice(p) {
  if (p.ledGpio == null) {
    p.ledGpio = DEFAULT_LED_GPIO[p.target] != null ? DEFAULT_LED_GPIO[p.target] : 2;
  }
  const gpioValid = Number.isInteger(p.ledGpio) && p.ledGpio >= 0;

  return `
    <div class="configure-grid">
      <div class="step-panel">
        <h2>Configure device</h2>
        <p class="step-hint">Set the driver options for this ${escapeHtml(deviceTypeName(p.deviceType))} on ${escapeHtml(moduleName(p.target))}.</p>

        <div class="driver-block">
          <h3>LED &middot; digital GPIO</h3>
          <label class="field-label" for="led-gpio">LED GPIO pin</label>
          <input type="number" id="led-gpio" min="0" max="48" value="${p.ledGpio}">
          <div class="field-error">${gpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
          <p class="field-note">
            Adjust to match your board — GPIO ${DEFAULT_LED_GPIO[p.target] != null ? DEFAULT_LED_GPIO[p.target] : 2}
            is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
          </p>
        </div>

        <p class="note-box">
          This only records your choice for now — it doesn't edit
          <code>firmware/light/main/app_main.cpp</code> yet. Applying it
          (replacing <code>LIGHT_LED_GPIO</code>) is part of the
          not-yet-built Generate Firmware step.
        </p>

        ${renderWizardFooter(p, gpioValid)}
      </div>

      <div class="config-sidebar">
        <h3>Configuration summary</h3>
        <div class="summary-row">
          <div class="summary-label">DEVICE</div>
          <div class="summary-value">${escapeHtml(deviceTypeName(p.deviceType))}</div>
        </div>
        <div class="summary-row">
          <div class="summary-label">MODULE</div>
          <div class="summary-value">${escapeHtml(moduleName(p.target))}</div>
        </div>
        <div class="summary-row">
          <div class="summary-label">DRIVER</div>
          <div class="summary-value">GPIO (digital on/off)</div>
          <div class="summary-detail">IO pin: GPIO ${gpioValid ? p.ledGpio : "?"}</div>
        </div>
      </div>
    </div>
  `;
}

function renderTestProduct(p) {
  return `
    <div class="step-panel">
      <h2>Test your device</h2>
      <p class="step-hint">
        Optional: connect a board already flashed via the Docker build
        (see <code>docs/getting-started.md</code>) and watch its serial
        log — handy for checking commissioning output. This talks to
        whatever firmware is already on the board; generating and flashing
        firmware straight from this wizard isn't built yet.
      </p>

      ${serialState.supported ? renderSerialMonitor() : `
        <div class="warn-box">
          &#9888; Serial Monitor needs the Web Serial API — supported in
          Chrome or Edge, not this browser.
        </div>
      `}

      <div class="option-card disabled">
        <h3>Download the generated firmware</h3>
        <p class="desc">Available once the Generate Firmware step exists.</p>
      </div>

      ${renderWizardFooter(p, true)}
    </div>
  `;
}

function renderSerialMonitor() {
  return `
    <div class="serial-panel">
      <div class="serial-controls">
        <select id="serial-baud" title="Baud rate">
          <option value="115200">115200 (idf.py monitor default)</option>
          <option value="74880">74880 (ROM bootloader)</option>
          <option value="230400">230400</option>
          <option value="9600">9600</option>
        </select>
        <button class="secondary" id="serial-connect-btn">Connect</button>
        <button class="link" id="serial-clear-btn">Clear log</button>
        <span class="status-dot" id="serial-status">Not connected</span>
      </div>
      <pre class="serial-log" id="serial-log"></pre>
    </div>
  `;
}

/* Web Serial connection — deliberately kept outside the render/state cycle.
 * A full re-render would tear down and recreate the <pre> log element and
 * sever the read loop's reference to it, so connect/disconnect/log updates
 * touch the DOM directly instead of going through render(). */
const serialState = {
  supported: !!(navigator.serial),
  port: null,
  reader: null,
  connected: false,
};

async function connectSerial() {
  try {
    const port = await navigator.serial.requestPort();
    const baudSelect = document.getElementById("serial-baud");
    const baudRate = baudSelect ? parseInt(baudSelect.value, 10) : 115200;
    await port.open({ baudRate });
    serialState.port = port;
    serialState.connected = true;
    updateSerialUI();
    readSerialLoop(port);
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  }
}

async function readSerialLoop(port) {
  const decoder = new TextDecoderStream();
  const streamClosed = port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  serialState.reader = reader;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) appendSerialLog(value);
    }
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  } finally {
    reader.releaseLock();
    await streamClosed;
  }
}

async function disconnectSerial() {
  try {
    if (serialState.reader) await serialState.reader.cancel();
    if (serialState.port) await serialState.port.close();
  } catch (err) {
    // Port may already be gone (device unplugged) — nothing to do.
  }
  serialState.port = null;
  serialState.reader = null;
  serialState.connected = false;
  updateSerialUI();
}

function appendSerialLog(text) {
  const log = document.getElementById("serial-log");
  if (!log) return;
  log.textContent += text;
  log.scrollTop = log.scrollHeight;
}

function updateSerialUI() {
  const btn = document.getElementById("serial-connect-btn");
  const status = document.getElementById("serial-status");
  if (!btn || !status) return;
  btn.textContent = serialState.connected ? "Disconnect" : "Connect";
  status.textContent = serialState.connected ? "Connected" : "Not connected";
  status.classList.toggle("connected", serialState.connected);
}

function renderStubStep(p) {
  return `
    <div class="wizard-panel">
      <span class="badge-soon">Coming soon</span>
      <h2>${escapeHtml(WIZARD_STEPS[p.step])}</h2>
      <p>
        Not wired up yet. So far: device type
        <strong>${escapeHtml(deviceTypeName(p.deviceType))}</strong> on
        <strong>${escapeHtml(moduleName(p.target))}</strong>.
      </p>
      ${renderWizardFooter(p, false)}
    </div>
  `;
}

function renderWizardFooter(p, canProceed) {
  const backLabel = p.step === 0 ? "&larr; Back to dashboard" : "&larr; Back";
  const isLastStep = p.step === WIZARD_STEPS.length - 1;
  const nextLabel = isLastStep ? "Done" : "Next step &rarr;";
  return `
    <div class="wizard-footer">
      <button class="secondary" id="wizard-back-btn">${backLabel}</button>
      <button class="primary" id="wizard-next-btn" ${canProceed ? "" : "disabled"}>${nextLabel}</button>
    </div>
  `;
}

function deviceTypeName(id) {
  const d = DEVICE_TYPES.find((x) => x.id === id);
  return d ? d.name : "—";
}

function moduleName(id) {
  const m = MODULES.find((x) => x.id === id);
  return m ? m.name : "—";
}

/* ---------- Events ---------- */

function bindEvents() {
  const createBtn = document.getElementById("create-product-btn");
  if (createBtn) createBtn.addEventListener("click", () => goTo("setup"));

  document.querySelectorAll("[data-open-product]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-open-product");
      state.currentProduct = state.products.find((p) => p.id === id);
      goTo("wizard");
    });
  });

  const cancelBtn = document.getElementById("setup-cancel-btn");
  if (cancelBtn) cancelBtn.addEventListener("click", () => goTo("dashboard"));

  const nameInput = document.getElementById("product-name");
  const startBtn = document.getElementById("setup-start-btn");
  const errorEl = document.getElementById("product-name-error");

  if (nameInput) {
    nameInput.focus();
    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim().length === 0;
      errorEl.textContent = "";
    });
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !startBtn.disabled) startBtn.click();
    });
  }

  if (startBtn) {
    startBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) {
        errorEl.textContent = "Product name is required.";
        return;
      }
      const product = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        createdAt: new Date().toISOString(),
        step: 0,
        deviceType: null,
        target: null,
        ledGpio: null,
      };
      state.products.push(product);
      state.currentProduct = product;
      saveProducts();
      goTo("wizard");
    });
  }

  document.querySelectorAll("[data-select-device-type]").forEach((el) => {
    el.addEventListener("click", () => {
      state.currentProduct.deviceType = el.getAttribute("data-select-device-type");
      saveProducts();
      render();
    });
  });

  const ledGpioInput = document.getElementById("led-gpio");
  if (ledGpioInput) {
    ledGpioInput.addEventListener("input", () => {
      const raw = ledGpioInput.value;
      state.currentProduct.ledGpio = raw === "" ? null : parseInt(raw, 10);
      saveProducts();
      render();
      document.getElementById("led-gpio").focus();
    });
  }

  document.querySelectorAll("[data-select-module]").forEach((el) => {
    el.addEventListener("click", () => {
      state.currentProduct.target = el.getAttribute("data-select-module");
      saveProducts();
      render();
    });
  });

  const serialConnectBtn = document.getElementById("serial-connect-btn");
  if (serialConnectBtn) {
    serialConnectBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      else connectSerial();
    });
  }

  const serialClearBtn = document.getElementById("serial-clear-btn");
  if (serialClearBtn) {
    serialClearBtn.addEventListener("click", () => {
      const log = document.getElementById("serial-log");
      if (log) log.textContent = "";
    });
  }

  // Reflect the live connection state if this step's DOM was just
  // (re-)created — e.g. after an unrelated re-render while connected.
  if (document.getElementById("serial-connect-btn")) updateSerialUI();

  const backBtn = document.getElementById("wizard-back-btn");
  if (backBtn) {
    backBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      const p = state.currentProduct;
      if (p.step === 0) {
        goTo("dashboard");
      } else {
        p.step -= 1;
        saveProducts();
        render();
      }
    });
  }

  const nextBtn = document.getElementById("wizard-next-btn");
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      const p = state.currentProduct;
      if (p.step < WIZARD_STEPS.length - 1) {
        p.step += 1;
        saveProducts();
        render();
      } else {
        goTo("dashboard");
      }
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString();
}

render();
</script>

</body>
</html>
