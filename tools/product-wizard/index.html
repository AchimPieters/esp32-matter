<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>esp32-matter — Product Wizard</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #e2e6ec;
    --bg: #f6f7f9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --card-bg: #ffffff;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header.topbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.topbar .logo {
    font-weight: 700;
    font-size: 16px;
  }

  header.topbar .logo span {
    color: var(--blue);
  }

  header.topbar .tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin-left: 4px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---------- Dashboard ---------- */

  .dashboard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .dashboard-head h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }

  .dashboard-head p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button.primary:hover { background: var(--blue-dark); }

  button.primary:disabled {
    background: #b9c2d0;
    cursor: not-allowed;
  }

  button.secondary {
    background: #fff;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary:hover { background: #eef3ff; }

  button.link {
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .product-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
  }

  .product-card:hover { border-color: var(--blue); }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn:hover {
    background: #fdeeee;
    color: #c0392b;
  }

  .product-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .product-card .meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
  }

  /* ---------- Setup screen ---------- */

  .setup-wrap {
    max-width: 480px;
    margin: 60px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
  }

  .setup-wrap h2 {
    margin: 0 0 6px;
    font-size: 20px;
  }

  .setup-wrap p.hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-error {
    color: #c0392b;
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 16px;
  }

  .field-warning {
    color: #9a6700;
    font-size: 12px;
    margin-bottom: 16px;
  }

  .setup-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  /* ---------- Wizard stepper ---------- */

  .stepper {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 24px;
    margin-bottom: 28px;
    overflow-x: auto;
    gap: 4px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }

  .step .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d7dce3;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step.done .dot { background: var(--blue); }
  .step.active .dot { background: var(--blue); }
  .step.active { color: var(--blue); }

  .step-sep {
    color: #c6cbd4;
    margin: 0 6px;
  }

  .wizard-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
  }

  .wizard-panel h2 {
    margin: 0 0 8px;
  }

  .wizard-panel p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 460px;
    margin: 0 auto 24px;
  }

  .wizard-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }

  /* ---------- Wizard step content (Get Started / Select Module) ---------- */

  .step-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  .step-panel h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }

  .step-panel > p.step-hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .option-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
  }

  .option-card:hover { border-color: var(--blue); }

  .option-card.selected {
    border-color: var(--blue);
    background: #f5f8ff;
  }

  .option-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .option-card .desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 10px;
    min-height: 32px;
  }

  .badge-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .conn-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef1f6;
    color: var(--text-muted);
  }

  .conn-badge.wifi { background: #e6f4ff; color: #0b6bcb; }
  .conn-badge.ble { background: #eef0ff; color: #4338ca; }
  .conn-badge.thread { background: #e9f9ee; color: #1a7f37; }

  .option-card.selected .conn-badge {
    background: #ffffff;
  }

  .note-box {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .note-box code {
    background: #eef1f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ---------- Configure Device ---------- */

  .configure-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 720px) {
    .configure-grid { grid-template-columns: 1fr; }
  }

  .driver-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 4px;
  }

  .driver-block h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  input[type="number"] {
    width: 100%;
    max-width: 200px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }

  /* Sensor model picker — a checkable list on the left, selected sensor's
     detail text on the right, replacing a plain <select> so all options
     and their verified/bus info are visible at a glance. */
  .component-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .component-list {
    flex: 0 0 230px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .component-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .component-list-item:last-child { border-bottom: none; }
  .component-list-item:hover { background: #f8fafc; }
  .component-list-item.selected { background: #f5f8ff; }

  .component-list-item input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .component-list-item .tick {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
    background: #fff;
  }

  .component-list-item.selected .tick {
    border-color: var(--blue);
    background: var(--blue);
    color: #fff;
  }

  .component-list-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .component-name {
    font-size: 13px;
    font-weight: 600;
  }

  .component-bus {
    font-size: 11px;
    color: var(--text-muted);
  }

  .component-detail {
    flex: 1 1 220px;
    min-width: 200px;
  }

  .config-sidebar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .config-sidebar h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .summary-row {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .summary-row:first-of-type { border-top: none; }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .summary-value {
    font-size: 14px;
    font-weight: 600;
  }

  .summary-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---------- Test Product ---------- */

  .warn-box {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #f3caca;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .serial-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .serial-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .serial-controls select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }

  .status-dot {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: auto;
  }

  .status-dot.connected { color: #1a7f37; }

  .serial-log {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    border-radius: 8px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  /* ---------- Customise & Review ---------- */

  .review-grid {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 20px;
    margin-bottom: 8px;
  }

  .review-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }

  .review-row:first-child { border-top: none; }

  .code-block-wrap { margin-bottom: 14px; }

  .code-block-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .code-block {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0;
    white-space: pre;
  }

  .copy-feedback {
    margin-left: 10px;
    font-size: 12px;
    color: #1a7f37;
  }

</style>
</head>
<body>

<header class="topbar">
  <div class="logo">esp32-<span>matter</span></div>
  <div class="tagline">Product Wizard — local, offline, no cloud</div>
</header>

<main id="app"></main>

<script>
/*
 * Plain client-side state machine, no build step, no external dependencies.
 * Product data lives only in the browser's localStorage — nothing is sent
 * anywhere. All six wizard steps (Get Started through Generate Firmware)
 * are implemented; "generating" means producing ready-to-run commands you
 * copy and run yourself — this tool never writes to the repo directly.
 */

const STORAGE_KEY = "esp32matter.products";

// Same image + tag as tools/dev.sh, pinned to esp-matter's own recommended
// ESP-IDF version (v5.5.4) for reproducible builds — esp-matter doesn't
// support ESP-IDF v6.0.x yet. See CLAUDE.md before bumping this.
const ESP_MATTER_IMAGE = "espressif/esp-matter:release-v1.6_idf_v5.5.4";

const WIZARD_STEPS = [
  "Get Started",
  "Select Module",
  "Configure Device",
  "Test Product",
  "Customise & Review",
  "Generate Firmware",
];

/* Shared registry of physical components (sensor chips today; light
 * sources like relays/LEDs/LED strips are the anticipated next use —
 * see the comment on `componentOptions` below) that a device type can
 * offer a choice between. Defined once here rather than inline per
 * device type, so a component usable by more than one device type (e.g.
 * a relay module driving both an outlet and a future on/off light
 * variant) doesn't need its metadata duplicated and kept in sync by
 * hand in two places. Keyed by id; a DEVICE_TYPES entry lists which ids
 * apply to it via `componentOptions: [id, id, ...]` instead of embedding
 * full component objects.
 *
 * `verified: true` means hardware-tested in this repo specifically —
 * not a trustworthiness ranking of the driver code itself, which is
 * written to the same standard either way (see each driver's own
 * comment in the relevant app_main.cpp for exactly what was checked and
 * against which datasheet/reference source before writing timing- or
 * protocol-critical code). */
const COMPONENT_LIBRARY = {
  SHT3X: { name: "SHT3x", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: true, defineValue: "SENSOR_SHT3X" },
  SHT4X: { name: "SHT4x", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_SHT4X" },
  AHT20: { name: "AHT20", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_AHT20" },
  DHT11: { name: "DHT11", category: "temp-humidity", bus: "single-wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: true, defineValue: "SENSOR_DHT11" },
  DHT22: { name: "DHT22", category: "temp-humidity", bus: "single-wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: true, defineValue: "SENSOR_DHT22" },
  DS18B20: { name: "DS18B20 (temperature only)", category: "temp-humidity", bus: "1-Wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: false, defineValue: "SENSOR_DS18B20" },
  BME280: { name: "BME280", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_BME280" },
  LDR: { name: "LDR / photoresistor", category: "light", bus: "ADC", pin1Label: "ADC", pin2Label: null, usesPin2: false, verified: false, defineValue: "LIGHT_SENSOR_LDR", note: "Needs an ADC1-capable GPIO (32-39 on classic ESP32) — the driver is hardcoded to GPIO 34/ADC1 channel 6; see LIGHT_SENSOR_ADC_CHANNEL in app_main.cpp if you use a different ADC1 pin." },
  BH1750: { name: "BH1750", category: "light", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "LIGHT_SENSOR_BH1750", note: "Needs bidirectional I2C-capable GPIOs — avoid GPIO 32-39 (input-only on classic ESP32, can't do I2C). GPIO 21/22 are good defaults, same as the temperature sensor's I2C pins." },
};

/* Device types this repo actually has firmware for (see firmware/). Each
 * entry's `driver` block describes the one GPIO setting that device's
 * app_main.cpp actually exposes, plus the exact #define + file path so the
 * Customise & Review / Generate Firmware steps can generate a real diff
 * instead of a generic placeholder. Copy an existing firmware/ folder to
 * add a new type, per CLAUDE.md, and add a matching entry here. */
const DEVICE_TYPES = [
  {
    id: "light",
    name: "On/Off Light",
    desc: "Matter on/off light, driven by a single digital GPIO. Reference device in firmware/light/.",
    // Matches project(matter_light) in firmware/light/CMakeLists.txt — the
    // built app image is always <project name>.bin.
    binName: "matter_light.bin",
    driver: {
      summary: "GPIO (digital output)",
      fieldLabel: "LED GPIO pin",
      blockTitle: "LED · digital GPIO",
      filePath: "firmware/light/main/app_main.cpp",
      defineName: "LIGHT_LED_GPIO",
      // The literal value app_main.cpp ships with today, regardless of
      // target chip — this is the diff's baseline ("-" line).
      currentGpio: 2,
      // Suggested value to prefill per module (echoes the comment in
      // app_main.cpp: "GPIO 2 is common on classic ESP32 devkits; ESP32-C6
      // devkits often use GPIO 8") — you still have to edit the file.
      defaultsByModule: { esp32: 2, esp32c3: 8, esp32c6: 8, esp32s3: 2, esp32h2: 8 },
    },
    // Separate LED that blinks for the Matter "Identify" cluster — lets you
    // physically find the device, independent of its on/off state.
    identify: {
      summary: "GPIO (digital output)",
      fieldLabel: "Identify LED GPIO pin",
      blockTitle: "Identify LED · digital output",
      filePath: "firmware/light/main/app_main.cpp",
      defineName: "IDENTIFY_LED_GPIO",
      currentGpio: 4,
      defaultsByModule: { esp32: 4, esp32c3: 4, esp32c6: 4, esp32s3: 4, esp32h2: 4 },
    },
  },
  {
    id: "switch",
    name: "On/Off Switch",
    desc: "Matter on/off switch: a physical button sends an OnOff Toggle command to whatever device(s) it's bound to. Reference device in firmware/switch/.",
    // Matches project(matter_switch) in firmware/switch/CMakeLists.txt.
    binName: "matter_switch.bin",
    driver: {
      summary: "GPIO (digital input, active-low)",
      fieldLabel: "Button GPIO pin",
      blockTitle: "Button · digital GPIO input",
      filePath: "firmware/switch/main/app_main.cpp",
      defineName: "SWITCH_BUTTON_GPIO",
      // The literal value app_main.cpp ships with today — this is the
      // sed baseline. Reference wiring is a breadboard pushbutton: GND ->
      // button -> GPIO. Deliberately not the onboard BOOT/PROG button
      // (GPIO 0) — that pin doubles as boot-mode select and turned out
      // unreliable as a switch input on real hardware (see CLAUDE.md's
      // open next steps).
      currentGpio: 4,
      // Suggested value to prefill per module — GPIO 4 is a plain,
      // unreserved pin on all of these; still worth checking against your
      // specific board.
      defaultsByModule: { esp32: 4, esp32c3: 4, esp32c6: 4, esp32s3: 4, esp32h2: 4 },
    },
    identify: {
      summary: "GPIO (digital output)",
      fieldLabel: "Identify LED GPIO pin",
      blockTitle: "Identify LED · digital output",
      filePath: "firmware/switch/main/app_main.cpp",
      defineName: "IDENTIFY_LED_GPIO",
      currentGpio: 2,
      defaultsByModule: { esp32: 2, esp32c3: 2, esp32c6: 2, esp32s3: 2, esp32h2: 2 },
    },
  },
  {
    id: "contact",
    name: "Contact Sensor",
    desc: "Matter contact sensor: a digital input (e.g. a door/window reed switch) reports open/closed via the Boolean State cluster. Reference device in firmware/contact-sensor/.",
    // Matches project(matter_contact_sensor) in firmware/contact-sensor/CMakeLists.txt.
    binName: "matter_contact_sensor.bin",
    driver: {

      defineName: "CONTACT_GPIO",
      // The literal value app_main.cpp ships with today — this is the
      // sed baseline. Reference wiring is a reed switch: GND -> switch ->
      // GPIO, same active-low idiom as firmware/switch's button.
      // Deliberately not the onboard BOOT/PROG button (GPIO 0) — see
      // firmware/switch's comment / CLAUDE.md's open next steps for why.
      currentGpio: 4,
      // Suggested value to prefill per module — GPIO 4 is a plain,
      // unreserved pin on all of these; still worth checking against your

      defaultsByModule: { esp32: 4, esp32c3: 4, esp32c6: 4, esp32s3: 4, esp32h2: 4 },

  {
    id: "outlet",

    desc: "Matter On/Off Plug-in Unit: a physical button toggles the device's own on/off state, visible and controllable from Apple/Google Home (unlike the switch's client-only Binding approach). Reference device in firmware/outlet/.",

    driver: {
      summary: "GPIO (digital output)",

      defineName: "OUTLET_GPIO",
      currentGpio: 2,
      defaultsByModule: { esp32: 2, esp32c3: 2, esp32c6: 2, esp32s3: 2, esp32h2: 2 },
    },
    // Second GPIO this device type needs, alongside `driver` — the physical

    // "button") because firmware/temperature-sensor/ reuses this same

    secondary: {

      summary: "GPIO (digital input, active-low)",

      currentGpio: 4,
      defaultsByModule: { esp32: 4, esp32c3: 4, esp32c6: 4, esp32s3: 4, esp32h2: 4 },
    },
    identify: {
      summary: "GPIO (digital output)",
      fieldLabel: "Identify LED GPIO pin",
      blockTitle: "Identify LED · digital output",
      filePath: "firmware/outlet/main/app_main.cpp",
      defineName: "IDENTIFY_LED_GPIO",
      // Shares the output GPIO by default in the shipped firmware (see its

      currentGpio: 2,
      defaultsByModule: { esp32: 2, esp32c3: 2, esp32c6: 2, esp32s3: 2, esp32h2: 2 },
    },
  },
  {
    id: "temperature",
    name: "Temperature Sensor",
    desc: "Matter temperature + humidity sensor — pick which sensor chip you actually have wired up below. Reports via two endpoints (temperature_sensor + humidity_sensor device types — Matter has no single device type combining them; DS18B20 is temperature-only, so it only gets the one endpoint). Reference device in firmware/temperature-sensor/.",
    // Matches project(matter_temperature_sensor) in
    // firmware/temperature-sensor/CMakeLists.txt.
    binName: "matter_temperature_sensor.bin",
    // Which sensor chip's driver gets compiled in — a third sed target
    // (#define SENSOR_TYPE ...) alongside the driver/secondary GPIO
    // fields below, since app_main.cpp carries all seven drivers behind
    // #if SENSOR_TYPE == ... and only one compiles in at a time (see its
    // header comment for why: genuinely different protocols/command
    // sets, not just different GPIO numbers or I2C addresses). ids
    // resolve through COMPONENT_LIBRARY above — this set follows what's

    componentOptions: ["SHT3X", "SHT4X", "AHT20", "DHT11", "DHT22", "DS18B20", "BME280"],

      currentGpio: 21,

    secondary: {
      label: "Pin 2",
      summary: "Sensor pin 2 (SCL, I2C only)",
      fieldLabel: "Sensor pin 2 (SCL) GPIO",
      blockTitle: "Sensor · pin 2",

      defineName: "SENSOR_PIN_2",

      defaultsByModule: { esp32: 22, esp32c3: 22, esp32c6: 22, esp32s3: 22, esp32h2: 22 },

    identify: {
      summary: "GPIO (digital output)",
      fieldLabel: "Identify LED GPIO pin",
      blockTitle: "Identify LED · digital output",
      filePath: "firmware/temperature-sensor/main/app_main.cpp",
      defineName: "IDENTIFY_LED_GPIO",
      currentGpio: 2,
      defaultsByModule: { esp32: 2, esp32c3: 2, esp32c6: 2, esp32s3: 2, esp32h2: 2 },
    },
  },
  {
    id: "light-sensor",
    name: "Light Sensor",
    desc: "Matter ambient light sensor — pick which sensor you actually have wired up below. Reports illuminance via the Illuminance Measurement cluster. Reference device in firmware/light-sensor/.",
    // Second device type (after temperature) with a real component
    // choice: an LDR/photoresistor on the ADC (this repo's only analog
    // input device) or a BH1750 digital light sensor over I2C. Neither is
    // hardware-verified in this repo yet — see COMPONENT_LIBRARY above.
    // Matches project(matter_light_sensor) in
    // firmware/light-sensor/CMakeLists.txt. A third sed target
    // (#define SENSOR_TYPE ...) alongside the driver/secondary GPIO
    // fields, same mechanism as the temperature sensor — see its own

    componentOptions: ["LDR", "BH1750"],
    componentDefineName: "SENSOR_TYPE",
    binName: "matter_light_sensor.bin",
    driver: {
      summary: "Sensor pin 1 (ADC / SDA)",
      fieldLabel: "Sensor pin 1 (ADC / SDA) GPIO",
      blockTitle: "Sensor · pin 1",
      filePath: "firmware/light-sensor/main/app_main.cpp",
      defineName: "SENSOR_PIN_1",
      // GPIO 34 = ADC1 channel 6 on classic ESP32 (WROOM-32) — the LDR's
      // own default and this field's sed baseline. Deliberately an ADC1
      // pin, not ADC2 (ADC2 is unreliable once Wi-Fi is active). Not a
      // sensible default if you switch to BH1750 above — GPIO 32-39 are
      // input-only on classic ESP32 and can't do I2C, so change this to
      // 21 (see BH1750's own note in COMPONENT_LIBRARY) if you pick it.
      currentGpio: 34,
      defaultsByModule: { esp32: 34, esp32c3: 34, esp32c6: 34, esp32s3: 34, esp32h2: 34 },
    },
    // Second GPIO — only meaningful for BH1750 (SCL); unused (but
    // harmless to still set) for the LDR. Same optional `secondary` field

    secondary: {
      label: "Pin 2",
      summary: "Sensor pin 2 (SCL, BH1750 only)",
      fieldLabel: "Sensor pin 2 (SCL) GPIO",
      blockTitle: "Sensor · pin 2",
      filePath: "firmware/light-sensor/main/app_main.cpp",
      defineName: "SENSOR_PIN_2",
      currentGpio: 22,
      defaultsByModule: { esp32: 22, esp32c3: 22, esp32c6: 22, esp32s3: 22, esp32h2: 22 },
    },
    identify: {
      summary: "GPIO (digital output)",
      fieldLabel: "Identify LED GPIO pin",
      blockTitle: "Identify LED · digital output",
      filePath: "firmware/light-sensor/main/app_main.cpp",
      defineName: "IDENTIFY_LED_GPIO",
      currentGpio: 2,
      defaultsByModule: { esp32: 2, esp32c3: 2, esp32c6: 2, esp32s3: 2, esp32h2: 2 },
    },
  },
];

function findDeviceType(id) {
  return DEVICE_TYPES.find((d) => d.id === id) || null;
}

// Looks up a component (sensor chip, and eventually light-source parts
// like relays/LEDs) from the shared COMPONENT_LIBRARY by id, merging the
// id itself into the returned object for convenience at call sites.
function findComponent(id) {
  const c = COMPONENT_LIBRARY[id];
  return c ? { id, ...c } : null;
}

/* Chips this repo's Docker dev flow (tools/dev.sh) targets via
 * `idf.py set-target <chip>`. Connectivity reflects the actual radios on
 * each chip, not marketing copy — ESP32-H2 has no Wi-Fi, for example.
 *
 * bootloaderOffset: where the second-stage bootloader gets flashed — 0x1000
 * on the original ESP32 (Xtensa LX6), 0x0 on every later chip (RISC-V ones
 * and Xtensa S3). Getting this wrong doesn't fail loudly; the board just
 * won't boot. offsetsVerified is true only for esp32 — the one target this
 * project has actually built, flashed, and commissioned end to end. The
 * others follow documented ESP-IDF convention but haven't been confirmed
 * against real hardware in this repo yet; idf.py build always prints the
 * authoritative command for whatever it just built, so cross-check that if
 * you hit boot trouble on one of them. */
const MODULES = [
  {
    id: "esp32",
    name: "ESP32 (WROOM-32)",
    desc: "Classic dual-core ESP32 — the default target for this repo.",
    conn: ["wifi", "ble"],
    bootloaderOffset: "0x1000",
    offsetsVerified: true,
  },
  {
    id: "esp32c3",
    name: "ESP32-C3",
    desc: "Single-core RISC-V, compact and low-cost.",
    conn: ["wifi", "ble"],
    bootloaderOffset: "0x0",
    offsetsVerified: false,
  },
  {
    id: "esp32c6",
    name: "ESP32-C6",
    desc: "Wi-Fi 6 plus 802.15.4 — can run Matter over Thread.",
    conn: ["wifi", "ble", "thread"],
    bootloaderOffset: "0x0",
    offsetsVerified: false,
  },
  {
    id: "esp32s3",
    name: "ESP32-S3",
    desc: "Dual-core with more RAM/flash headroom.",
    conn: ["wifi", "ble"],
    bootloaderOffset: "0x0",
    offsetsVerified: false,
  },
  {
    id: "esp32h2",
    name: "ESP32-H2",
    desc: "802.15.4 (Thread/Zigbee) only — no Wi-Fi. Needs a Thread border router.",
    conn: ["ble", "thread"],
    bootloaderOffset: "0x0",
    offsetsVerified: false,
  },
];

const state = {
  screen: "dashboard", // "dashboard" | "setup" | "wizard"
  products: loadProducts(),
  currentProduct: null,
};

function loadProducts() {
  try {
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    // Migrate products saved before device types were generalised: the LED
    // GPIO field used to be called ledGpio specifically.
    products.forEach((p) => {
      if (p.gpioPin == null && p.ledGpio != null) p.gpioPin = p.ledGpio;
    });
    return products;
  } catch (e) {
    return [];
  }
}

function saveProducts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.products));
}

function goTo(screen) {
  state.screen = screen;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "dashboard") app.innerHTML = renderDashboard();
  else if (state.screen === "setup") app.innerHTML = renderSetup();
  else if (state.screen === "wizard") app.innerHTML = renderWizard();
  bindEvents();
}

/* ---------- Dashboard ---------- */

function renderDashboard() {
  const cards = state.products
    .map(
      (p) => `
      <div class="product-card" data-open-product="${p.id}">
        <button class="delete-btn" data-delete-product="${p.id}" title="Delete product" aria-label="Delete ${escapeHtml(p.name)}">&times;</button>
        <h3>${escapeHtml(p.name)}</h3>
        <div class="meta">
          ${moduleName(p.target) !== "—" ? escapeHtml(moduleName(p.target)) + " · " : ""}Step: ${WIZARD_STEPS[p.step]}
        </div>
      </div>`
    )
    .join("");

  const grid = state.products.length
    ? `<div class="product-grid">${cards}</div>`
    : `<div class="empty-state">No products yet. Create your first one to get started.</div>`;

  return `
    <div class="dashboard-head">
      <div>
        <h1>Your products</h1>
        <p>Configure Matter devices for the esp32-matter toolkit — everything stays on this machine.</p>
      </div>
      <button class="primary" id="create-product-btn">+ Create a new product</button>
    </div>
    ${grid}
  `;
}

/* ---------- Setup your product ---------- */

function renderSetup() {
  return `
    <div class="setup-wrap">
      <h2>Setup your product</h2>
      <p class="hint">Give your product a name. You can change it later.</p>

      <label class="field-label" for="product-name">Product name</label>
      <input type="text" id="product-name" placeholder="e.g. Living Room Light" autocomplete="off">
      <div class="field-error" id="product-name-error"></div>

      <div class="setup-actions">
        <button class="link" id="setup-cancel-btn">&larr; Cancel</button>
        <button class="primary" id="setup-start-btn" disabled>Start</button>
      </div>
    </div>
  `;
}

/* ---------- Wizard shell ---------- */

const CONN_LABELS = { wifi: "Wi-Fi", ble: "BLE", thread: "Thread" };

function renderWizard() {
  const p = state.currentProduct;
  const stepsHtml = WIZARD_STEPS.map((label, i) => {
    const cls = i < p.step ? "done" : i === p.step ? "active" : "";
    const marker = i < p.step ? "&#10003;" : i + 1;
    const sep = i < WIZARD_STEPS.length - 1 ? `<span class="step-sep">&rsaquo;</span>` : "";
    return `<div class="step ${cls}"><span class="dot">${marker}</span>${escapeHtml(label)}</div>${sep}`;
  }).join("");

  let content;
  if (p.step === 0) content = renderGetStarted(p);
  else if (p.step === 1) content = renderSelectModule(p);
  else if (p.step === 2) content = renderConfigureDevice(p);
  else if (p.step === 3) content = renderTestProduct(p);
  else if (p.step === 4) content = renderCustomiseReview(p);
  else if (p.step === 5) content = renderGenerateFirmware(p);
  else content = `<div class="wizard-panel"><p>Unknown step.</p></div>`;

  return `<div class="stepper">${stepsHtml}</div>${content}`;
}

function renderGetStarted(p) {
  // Auto-select the only device type there is today — future types will
  // require an explicit click once DEVICE_TYPES has more than one entry.
  if (!p.deviceType && DEVICE_TYPES.length === 1) p.deviceType = DEVICE_TYPES[0].id;

  const cards = DEVICE_TYPES.map((d) => {
    const selected = p.deviceType === d.id;
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-device-type="${d.id}">
        <h3>${escapeHtml(d.name)}</h3>
        <p class="desc">${escapeHtml(d.desc)}</p>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose your device</h2>
      <p class="step-hint">What kind of Matter device is "${escapeHtml(p.name)}"?</p>
      <div class="option-grid">${cards}</div>
      <p class="note-box">
        Every option above maps to a real, buildable folder under
        <code>firmware/</code> — none of these are UI placeholders. Adding
        another device type means copying one of those folders and
        swapping its endpoint type, per CLAUDE.md.
      </p>
      ${renderWizardFooter(p, !!p.deviceType)}
    </div>
  `;
}

function renderSelectModule(p) {
  const cards = MODULES.map((m) => {
    const selected = p.target === m.id;
    const badges = m.conn
      .map((c) => `<span class="conn-badge ${c}">${CONN_LABELS[c]}</span>`)
      .join("");
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-module="${m.id}">
        <h3>${escapeHtml(m.name)}</h3>
        <p class="desc">${escapeHtml(m.desc)}</p>
        <div class="badge-row">${badges}</div>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose an ESP module</h2>
      <p class="step-hint">Which chip will "${escapeHtml(p.name)}" run on? This maps to <code>idf.py set-target</code>.</p>
      <div class="option-grid">${cards}</div>
      ${renderWizardFooter(p, !!p.target)}
    </div>
  `;
}

// Old saved products predate this field entirely, so "enabled" has to be
// the default for undefined too — only an explicit false means off.
function identifyIsEnabled(p) {
  return p.identifyEnabled !== false;
}

function renderConfigureDevice(p) {
  const deviceType = findDeviceType(p.deviceType);
  const driver = deviceType ? deviceType.driver : null;
  const secondary = deviceType ? deviceType.secondary : null;
  const identify = deviceType ? deviceType.identify : null;
  const componentOptions = deviceType ? deviceType.componentOptions : null;
  const defaultGpio = driver ? (driver.defaultsByModule[p.target] != null ? driver.defaultsByModule[p.target] : 2) : 2;
  const defaultSecondaryGpio = secondary ? (secondary.defaultsByModule[p.target] != null ? secondary.defaultsByModule[p.target] : 4) : 4;
  const defaultIdentifyGpio = identify ? (identify.defaultsByModule[p.target] != null ? identify.defaultsByModule[p.target] : 4) : 4;
  const identifyOn = identifyIsEnabled(p);

  if (componentOptions && p.component == null) p.component = componentOptions[0];
  const selectedComponent = componentOptions ? (findComponent(p.component) || findComponent(componentOptions[0])) : null;

  if (p.gpioPin == null) p.gpioPin = defaultGpio;
  if (secondary && p.secondaryGpioPin == null) p.secondaryGpioPin = defaultSecondaryGpio;
  if (p.identifyGpioPin == null) p.identifyGpioPin = defaultIdentifyGpio;
  const gpioValid = Number.isInteger(p.gpioPin) && p.gpioPin >= 0;
  const secondaryGpioValid = !secondary || (Number.isInteger(p.secondaryGpioPin) && p.secondaryGpioPin >= 0);
  const identifyGpioValid = !identifyOn || (Number.isInteger(p.identifyGpioPin) && p.identifyGpioPin >= 0);
  const sameGpio = identifyOn && gpioValid && identifyGpioValid && p.gpioPin === p.identifyGpioPin;
  const allValid = gpioValid && secondaryGpioValid && identifyGpioValid;

  // Component-aware field labels: falls back to the device type's own
  // static text when there's no componentOptions list (every device type
  // except the temperature sensor, for now) so this doesn't change
  // anything for the others.
  const driverLabel = selectedComponent ? `${selectedComponent.pin1Label} GPIO pin` : (driver ? driver.fieldLabel : "GPIO pin");
  const driverBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin1Label}` : (driver ? driver.blockTitle : "GPIO");
  const secondaryLabel = selectedComponent ? `${selectedComponent.pin2Label || "Pin 2"} GPIO pin` : (secondary ? secondary.fieldLabel : "");
  const secondaryBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin2Label || "pin 2"}` : (secondary ? secondary.blockTitle : "");
  // Sensors picked via componentOptions that only need one data pin
  // (single-wire/1-Wire/ADC — usesPin2: false in COMPONENT_LIBRARY) don't
  // need the "pin 2" field shown at all — showing an editable GPIO field
  // for a pin the driver never reads was confusing (real bug report: it
  // looked required). Device types with a `secondary` field but no
  // componentOptions (e.g. outlet's Button) are unaffected — there's no
  // selectedComponent to consult, so this only hides the field, it never
  // changes whether secondaryGpioPin itself gets defaulted/validated.
  const secondaryFieldNeeded = !!secondary && !(selectedComponent && !selectedComponent.usesPin2);

  return `
    <div class="configure-grid">
      <div class="step-panel">
        <h2>Configure device</h2>
        <p class="step-hint">Set the driver options for this ${escapeHtml(deviceTypeName(p.deviceType))} on ${escapeHtml(moduleName(p.target))}.</p>

        ${componentOptions ? `
          <div class="driver-block">
            <h3>Sensor model</h3>
            <p class="field-label">Which sensor do you have wired up?</p>
            <div class="component-picker">
              <div class="component-list" role="radiogroup" aria-label="Sensor model">
                ${componentOptions.map(findComponent).map((s) => `
                  <label class="component-list-item ${s.id === selectedComponent.id ? "selected" : ""}">
                    <input type="radio" name="sensor-model" value="${escapeHtml(s.id)}" ${s.id === selectedComponent.id ? "checked" : ""}>
                    <span class="tick">&#10003;</span>
                    <span class="component-list-item-text">
                      <span class="component-name">${escapeHtml(s.name)}</span>
                      <span class="component-bus">${escapeHtml(s.bus)}${s.verified ? "" : " · unverified"}</span>
                    </span>
                  </label>
                `).join("")}
              </div>
              <div class="component-detail">
                <p class="field-note" style="margin-top:0;">
                  ${selectedComponent.verified
                    ? `Verified on real hardware in this repo.`
                    : `Implemented from the sensor's datasheet/reference driver, but not personally tested on real hardware in this repo — see the comment above its section in ${escapeHtml(driver ? driver.filePath : "app_main.cpp")} for exactly what was checked.`}
                  ${!selectedComponent.usesPin2 ? ` This sensor only needs one data pin (${escapeHtml(selectedComponent.pin1Label)}) — the "pin 2" field below is hidden since its driver doesn't use it.` : ""}
                  ${selectedComponent.note ? ` ${escapeHtml(selectedComponent.note)}` : ""}
                </p>
              </div>
            </div>
          </div>
        ` : ""}

        <div class="driver-block">
          <h3>${escapeHtml(driverBlockTitle)}</h3>
          <label class="field-label" for="gpio-pin">${escapeHtml(driverLabel)}</label>
          <input type="number" id="gpio-pin" min="0" max="48" value="${p.gpioPin}">
          <div class="field-error">${gpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
          <p class="field-note">
            Adjust to match your board — GPIO ${defaultGpio}
            is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
          </p>
        </div>

        ${secondaryFieldNeeded ? `
          <div class="driver-block">
            <h3>${escapeHtml(secondaryBlockTitle)}</h3>
            <label class="field-label" for="secondary-gpio-pin">${escapeHtml(secondaryLabel)}</label>
            <input type="number" id="secondary-gpio-pin" min="0" max="48" value="${p.secondaryGpioPin}">
            <div class="field-error">${secondaryGpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
            <p class="field-note">
              Adjust to match your board — GPIO ${defaultSecondaryGpio}
              is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
            </p>
          </div>
        ` : ""}

        <div class="driver-block">
          <label class="checkbox-label" for="identify-enabled">
            <input type="checkbox" id="identify-enabled" ${identifyOn ? "checked" : ""}>
            <h3 style="display:inline; margin:0;">Add an Identify LED</h3>
          </label>
          <p class="field-note" style="margin-top:4px;">

/* Web Serial connection — deliberately kept outside the render/state cycle.
 * A full re-render would tear down and recreate the <pre> log element and
 * sever the read loop's reference to it, so connect/disconnect/log updates
 * touch the DOM directly instead of going through render(). */
const serialState = {
  supported: !!(navigator.serial),
  port: null,
  reader: null,
  connected: false,
};

async function connectSerial() {
  try {
    const port = await navigator.serial.requestPort();
    const baudSelect = document.getElementById("serial-baud");
    const baudRate = baudSelect ? parseInt(baudSelect.value, 10) : 115200;
    await port.open({ baudRate });
    serialState.port = port;
    serialState.connected = true;
    updateSerialUI();
    readSerialLoop(port);
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  }
}

async function readSerialLoop(port) {
  const decoder = new TextDecoderStream();
  const streamClosed = port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  serialState.reader = reader;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) appendSerialLog(value);
    }
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  } finally {
    reader.releaseLock();
    await streamClosed;
  }
}

async function disconnectSerial() {
  try {
    if (serialState.reader) await serialState.reader.cancel();
    if (serialState.port) await serialState.port.close();
  } catch (err) {
    // Port may already be gone (device unplugged) — nothing to do.
  }
  serialState.port = null;
  serialState.reader = null;
  serialState.connected = false;
  updateSerialUI();
}

function appendSerialLog(text) {
  const log = document.getElementById("serial-log");
  if (!log) return;
  log.textContent += text;
  log.scrollTop = log.scrollHeight;
}

function updateSerialUI() {
  const btn = document.getElementById("serial-connect-btn");
  const status = document.getElementById("serial-status");
  if (!btn || !status) return;
  btn.textContent = serialState.connected ? "Disconnect" : "Connect";
  status.textContent = serialState.connected ? "Connected" : "Not connected";
  status.classList.toggle("connected", serialState.connected);
}

/* This page always lives at <repo>/tools/product-wizard/index.html when
 * opened the normal way (open tools/product-wizard/index.html). A file://
 * page can't browse your filesystem, but it CAN read its own location — so
 * instead of asking you to type your checkout path, or guessing where you
 * saved a downloaded file, we read it straight out of window.location and
 * bake the real absolute path into the generated command. Returns null if
 * the page isn't being served as file:// from that expected location (e.g.
 * you renamed the folder, or it's running off a web server). */
function detectRepoRoot() {
  if (window.location.protocol !== "file:") return null;
  const marker = "/tools/product-wizard/";
  const path = decodeURIComponent(window.location.pathname);
  const idx = path.indexOf(marker);
  return idx === -1 ? null : path.slice(0, idx);
}

// Strips anything that would need escaping inside a double-quoted shell
// string (quotes, backslashes, backticks, $) before a product name goes
// into a generated command — simpler and safer than trying to escape it
// correctly for every shell this might get pasted into.
function shellSafeName(str) {
  return str.replace(/[^a-zA-Z0-9 _-]/g, "").trim() || "Device";
}

// Real `sed -i` commands that actually apply the GPIO changes — one per
// #define. Using this instead of `patch` is a deliberate fix: the unified
// diff shown in Customise & Review (buildConfigPreview) uses a bare `@@`
// hunk header with no line numbers, which is display-only and turned out
// NOT to be a format `patch` actually accepts (verified directly:
// `patch: **** Only garbage was found in the patch input.` — this was
// caught by actually running it, not by inspecting the text). A `sed`
// substitution anchored on the #define's name has no such format to get
// wrong, doesn't care what the current value is (`GPIO_NUM_[0-9]+`
// matches whatever's there), and needs no line numbers at all.
function buildSedCommands(p) {
  const deviceType = findDeviceType(p.deviceType);
  const driver = deviceType ? deviceType.driver : null;
  const secondary = deviceType ? deviceType.secondary : null;
  const identify = deviceType ? deviceType.identify : null;
  const componentOptions = deviceType ? deviceType.componentOptions : null;
  const filePath = driver ? driver.filePath.split("/").slice(2).join("/") : "main/app_main.cpp"; // relative to firmwareDir
  const cmds = [];
  if (componentOptions && deviceType.componentDefineName) {
    const selectedSensor = findComponent(p.component) || findComponent(componentOptions[0]);
    // Not a GPIO_NUM_<n> value like the others below — this selects which
    // sensor driver compiles in at all (#define SENSOR_TYPE SENSOR_xxx),
    // so it needs its own pattern rather than reusing the GPIO one.
    cmds.push(`sed -i 's/^#define ${deviceType.componentDefineName} .*/#define ${deviceType.componentDefineName} ${selectedSensor.defineValue}/' ${filePath}`);
  }
  if (driver) {
    cmds.push(`sed -i 's/^#define ${driver.defineName} GPIO_NUM_[0-9][0-9]*/#define ${driver.defineName} GPIO_NUM_${p.gpioPin}/' ${filePath}`);
  }
  if (secondary) {
    cmds.push(`sed -i 's/^#define ${secondary.defineName} GPIO_NUM_[0-9][0-9]*/#define ${secondary.defineName} GPIO_NUM_${p.secondaryGpioPin}/' ${filePath}`);
  }
  if (identify && identifyIsEnabled(p)) {
    cmds.push(`sed -i 's/^#define ${identify.defineName} GPIO_NUM_[0-9][0-9]*/#define ${identify.defineName} GPIO_NUM_${p.identifyGpioPin}/' ${filePath}`);
  }
  return cmds;
}

function buildDockerRunCmd(p, repoRoot) {
  const { setTargetCmd } = buildConfigPreview(p);
  const deviceType = findDeviceType(p.deviceType);
  const driver = deviceType ? deviceType.driver : null;
  const firmwareDir = driver ? driver.filePath.replace(/\/main\/app_main\.cpp$/, "") : "firmware/light";
  const mountPath = repoRoot || "<path-to-esp32-matter>";
  const productNameSafe = shellSafeName(p.name);

  // No need to source export.sh: the espressif/esp-matter image's own
  // entrypoint already does that before handing off to this command. It
  // does, however, leave the shell in $ESP_MATTER_PATH — never /project,
  // no matter what -w is passed to docker run — so every path below is
  // absolute against /project rather than relative. gen_factory.sh writes
  // its output under ./out/ relative to wherever it's invoked from, so it
  // runs from the same firmware/<type> directory as the build, landing
  // output at firmware/<type>/out/ — right where the flash command below
  // expects to find it.
  const inner = [
    `cd /project/${firmwareDir}`,
    ...buildSedCommands(p),
    setTargetCmd,
    "idf.py build",
    `PRODUCT_NAME='${productNameSafe}' /project/tools/gen_factory.sh`,
  ].join(" && ");

  // The outer wrapper has to be double-quoted, not single-quoted: each
  // sed command above already uses single quotes around its own regex
  // (sed -i 's/…/…/'), and those would otherwise close the outer '...'
  // early the moment a human actually pastes this into a real shell —
  // exactly the kind of nested-quote bug that's easy to miss just by
  // reading the string, only caught here by generating one and running
  // it for real. Nothing inside `inner` contains a literal " or a $ that
  // needs to survive to the container, so double-quoting the outside is
  // safe today — but if you add a $VAR reference meant for the
  // container's shell later, remember the *host* shell expands $ inside
  // double quotes before docker ever sees it.
  return `docker run --rm -it -v "${mountPath}:/project" -w /project ${ESP_MATTER_IMAGE} bash -c "${inner}"`;
}

function buildFlashCmd(p, repoRoot) {
  const deviceType = findDeviceType(p.deviceType);
  const firmwareDir = deviceType ? deviceType.driver.filePath.replace(/\/main\/app_main\.cpp$/, "") : "firmware/light";
  const binName = deviceType ? deviceType.binName : "matter_light.bin";
  const module = findModule(p.target);
  const bootloaderOffset = module ? module.bootloaderOffset : "0x1000";
  const dir = repoRoot ? `${repoRoot}/${firmwareDir}` : firmwareDir;

  return [
    `esptool.py --chip ${p.target || "<module>"} -p <PORT> -b 460800 --before default_reset --after hard_reset write_flash \\`,
    "  --flash_mode dio --flash_size 4MB --flash_freq 40m \\",
    `  ${bootloaderOffset}  ${dir}/build/bootloader/bootloader.bin \\`,
    `  0x8000  ${dir}/build/partition_table/partition-table.bin \\`,
    `  0x10000 ${dir}/build/ota_data_initial.bin \\`,
    `  0x20000 ${dir}/build/${binName} \\`,
    `  0x3E0000 ${dir}/out/*/*/*-partition.bin`,
  ].join("\n");
}

function renderWizardFooter(p, canProceed) {
  const backLabel = p.step === 0 ? "&larr; Back to dashboard" : "&larr; Back";
  const isLastStep = p.step === WIZARD_STEPS.length - 1;
  const nextLabel = isLastStep ? "Done" : "Next step &rarr;";
  return `
    <div class="wizard-footer">
      <button class="secondary" id="wizard-back-btn">${backLabel}</button>
      <button class="primary" id="wizard-next-btn" ${canProceed ? "" : "disabled"}>${nextLabel}</button>
    </div>
  `;
}

function deviceTypeName(id) {
  const d = DEVICE_TYPES.find((x) => x.id === id);
  return d ? d.name : "—";
}

function driverSummary(deviceTypeId) {
  const d = findDeviceType(deviceTypeId);
  return d ? d.driver.summary : "—";
}

function moduleName(id) {
  const m = MODULES.find((x) => x.id === id);
  return m ? m.name : "—";
}

function findModule(id) {
  return MODULES.find((x) => x.id === id) || null;
}

/* Wires a "Copy" button to copy one specific <pre> block's text, with a
 * transient "Copied!" / failure message in a nearby feedback span. Used
 * for every single-block copy button; copy-preview-btn (Customise &
 * Review) is the one exception that intentionally copies more than one
 * block at once, so it keeps its own handler. */
function bindCopyButton(buttonId, blockId, feedbackId) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  btn.addEventListener("click", async () => {
    const block = document.getElementById(blockId);
    const feedback = document.getElementById(feedbackId);
    try {
      await navigator.clipboard.writeText(block ? block.textContent : "");
      if (feedback) feedback.textContent = "Copied!";
    } catch (err) {
      if (feedback) feedback.textContent = "Copy failed — select the text manually.";
    }
    if (feedback) setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
}

/* ---------- Events ---------- */

function bindEvents() {
  const createBtn = document.getElementById("create-product-btn");
  if (createBtn) createBtn.addEventListener("click", () => goTo("setup"));

  document.querySelectorAll("[data-open-product]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-open-product");
      state.currentProduct = state.products.find((p) => p.id === id);
      goTo("wizard");
    });
  });

  document.querySelectorAll("[data-delete-product]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation(); // don't also trigger the card's open-product click
      const id = el.getAttribute("data-delete-product");
      const product = state.products.find((p) => p.id === id);
      if (!product) return;
      if (!confirm(`Delete "${product.name}"? This can't be undone.`)) return;
      state.products = state.products.filter((p) => p.id !== id);
      saveProducts();
      render();
    });
  });

  const cancelBtn = document.getElementById("setup-cancel-btn");
  if (cancelBtn) cancelBtn.addEventListener("click", () => goTo("dashboard"));

  const nameInput = document.getElementById("product-name");
  const startBtn = document.getElementById("setup-start-btn");
  const errorEl = document.getElementById("product-name-error");

  if (nameInput) {
    nameInput.focus();
    nameInput.addEventListener("input", () => {
      startBtn.disabled = nameInput.value.trim().length === 0;
      errorEl.textContent = "";
    });
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !startBtn.disabled) startBtn.click();
    });
  }

  if (startBtn) {
    startBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) {
        errorEl.textContent = "Product name is required.";
        return;
      }
      const product = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        createdAt: new Date().toISOString(),
        step: 0,
        deviceType: null,
        target: null,
        gpioPin: null,
        secondaryGpioPin: null,
        component: null,
        identifyEnabled: true,
        identifyGpioPin: null,
      };
      state.products.push(product);
      state.currentProduct = product;
      saveProducts();
      goTo("wizard");
    });
  }

  document.querySelectorAll("[data-select-device-type]").forEach((el) => {
    el.addEventListener("click", () => {
      const newType = el.getAttribute("data-select-device-type");
      if (state.currentProduct.deviceType !== newType) {
        // Each device type has its own GPIO defaults (see DEVICE_TYPES in
        // this file) — an old value left over from a previously-selected
        // type is wrong for the new one, but renderConfigureDevice() only
        // fills these in when they're null, so a stale non-null value
        // would otherwise silently stick around and show the wrong
        // number without any indication it's wrong (caught by hand:
        // switching from a type defaulting to GPIO 2 to one defaulting to
        // GPIO 21 kept showing 2, silently, until spotted on real
        // hardware). Reset on every actual type change so the new type's
        // real defaults populate fresh.
        state.currentProduct.gpioPin = null;
        state.currentProduct.secondaryGpioPin = null;
        state.currentProduct.identifyGpioPin = null;
        state.currentProduct.component = null;
      }
      state.currentProduct.deviceType = newType;
      saveProducts();
      render();
    });
  });

  const gpioPinInput = document.getElementById("gpio-pin");
  if (gpioPinInput) {
    gpioPinInput.addEventListener("input", () => {
      const raw = gpioPinInput.value;
      state.currentProduct.gpioPin = raw === "" ? null : parseInt(raw, 10);
      saveProducts();
      render();
      document.getElementById("gpio-pin").focus();
    });
  }

  document.querySelectorAll('input[name="sensor-model"]').forEach((el) => {
    el.addEventListener("change", () => {
      if (!el.checked) return;
      state.currentProduct.component = el.value;
      saveProducts();
      render();
    });
  });

  const secondaryGpioPinInput = document.getElementById("secondary-gpio-pin");
  if (secondaryGpioPinInput) {
    secondaryGpioPinInput.addEventListener("input", () => {
      const raw = secondaryGpioPinInput.value;
      state.currentProduct.secondaryGpioPin = raw === "" ? null : parseInt(raw, 10);
      saveProducts();
      render();
      document.getElementById("secondary-gpio-pin").focus();
    });
  }

  const identifyGpioPinInput = document.getElementById("identify-gpio-pin");
  if (identifyGpioPinInput) {
    identifyGpioPinInput.addEventListener("input", () => {
      const raw = identifyGpioPinInput.value;
      state.currentProduct.identifyGpioPin = raw === "" ? null : parseInt(raw, 10);
      saveProducts();
      render();
      document.getElementById("identify-gpio-pin").focus();
    });
  }

  const identifyEnabledInput = document.getElementById("identify-enabled");
  if (identifyEnabledInput) {
    identifyEnabledInput.addEventListener("change", () => {
      state.currentProduct.identifyEnabled = identifyEnabledInput.checked;
      saveProducts();
      render();
    });
  }

  document.querySelectorAll("[data-select-module]").forEach((el) => {
    el.addEventListener("click", () => {
      state.currentProduct.target = el.getAttribute("data-select-module");
      saveProducts();
      render();
    });
  });

  const serialConnectBtn = document.getElementById("serial-connect-btn");
  if (serialConnectBtn) {
    serialConnectBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      else connectSerial();
    });
  }

  const serialClearBtn = document.getElementById("serial-clear-btn");
  if (serialClearBtn) {
    serialClearBtn.addEventListener("click", () => {
      const log = document.getElementById("serial-log");
      if (log) log.textContent = "";
    });
  }

  // Reflect the live connection state if this step's DOM was just
  // (re-)created — e.g. after an unrelated re-render while connected.
  if (document.getElementById("serial-connect-btn")) updateSerialUI();

  document.querySelectorAll("[data-goto-step]").forEach((el) => {
    el.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      state.currentProduct.step = parseInt(el.getAttribute("data-goto-step"), 10);
      saveProducts();
      render();
    });
  });

  const copyPreviewBtn = document.getElementById("copy-preview-btn");
  if (copyPreviewBtn) {
    copyPreviewBtn.addEventListener("click", async () => {
      const text = Array.from(document.querySelectorAll(".code-block"))
        .map((el) => el.textContent)
        .join("\n\n");
      const feedback = document.getElementById("copy-feedback");
      try {
        await navigator.clipboard.writeText(text);
        if (feedback) feedback.textContent = "Copied!";
      } catch (err) {
        if (feedback) feedback.textContent = "Copy failed — select the text manually.";
      }
      if (feedback) setTimeout(() => { feedback.textContent = ""; }, 2500);
    });
  }

  bindCopyButton("copy-docker-btn", "docker-cmd-block", "docker-copy-feedback");
  bindCopyButton("copy-flash-btn", "flash-cmd-block", "flash-copy-feedback");

  const backBtn = document.getElementById("wizard-back-btn");
  if (backBtn) {
    backBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      const p = state.currentProduct;
      if (p.step === 0) {
        goTo("dashboard");
      } else {
        p.step -= 1;
        saveProducts();
        render();
      }
    });
  }

  const nextBtn = document.getElementById("wizard-next-btn");
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      if (serialState.connected) disconnectSerial();
      const p = state.currentProduct;
      if (p.step < WIZARD_STEPS.length - 1) {
        p.step += 1;
        saveProducts();
        render();
      } else {
        goTo("dashboard");
      }
    });
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString();
}

render();
</script>
