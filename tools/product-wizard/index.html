<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>esp32-matter — Product Wizard</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #e2e6ec;
    --bg: #f6f7f9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --card-bg: #ffffff;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header.topbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.topbar .logo {
    font-weight: 700;
    font-size: 16px;
  }

  header.topbar .logo span {
    color: var(--blue);
  }

  header.topbar .tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin-left: 4px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  footer.app-footer {
    border-top: 1px solid var(--border);
    padding: 16px 32px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* ---------- Dashboard ---------- */

  .dashboard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .dashboard-head h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }

  .dashboard-head p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button.primary:hover { background: var(--blue-dark); }

  button.primary:disabled {
    background: #b9c2d0;
    cursor: not-allowed;
  }

  button.secondary {
    background: #fff;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary:hover { background: #eef3ff; }

  button.link {
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .product-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
  }

  .product-card:hover { border-color: var(--blue); }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn:hover {
    background: #fdeeee;
    color: #c0392b;
  }

  .product-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .product-card .meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
  }

  /* ---------- Setup screen ---------- */

  .setup-wrap {
    max-width: 480px;
    margin: 60px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
  }

  .setup-wrap h2 {
    margin: 0 0 6px;
    font-size: 20px;
  }

  .setup-wrap p.hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-error {
    color: #c0392b;
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 16px;
  }

  .field-warning {
    color: #9a6700;
    font-size: 12px;
    margin-bottom: 16px;
  }

  .setup-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  /* ---------- Wizard stepper ---------- */

  .stepper {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 24px;
    margin-bottom: 28px;
    overflow-x: auto;
    gap: 4px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }

  .step .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d7dce3;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step.done .dot { background: var(--blue); }
  .step.active .dot { background: var(--blue); }
  .step.active { color: var(--blue); }

  .step-sep {
    color: #c6cbd4;
    margin: 0 6px;
  }

  .wizard-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
  }

  .wizard-panel h2 {
    margin: 0 0 8px;
  }

  .wizard-panel p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 460px;
    margin: 0 auto 24px;
  }

  .wizard-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }

  /* ---------- Wizard step content (Get Started / Select Module) ---------- */

  .step-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  .step-panel h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }

  .step-panel > p.step-hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .option-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
  }

  .option-card:hover { border-color: var(--blue); }

  .option-card.selected {
    border-color: var(--blue);
    background: #f5f8ff;
  }

  /* Device-type icon — HomeKit-style rounded-square line art, one per
     DEVICE_TYPES entry (see DEVICE_TYPE_ICONS). Not used on the module
     picker's cards (those have connectivity badges instead — a chip isn't
     a device category, a HomeKit-style icon wouldn't mean anything there). */
  .option-card .device-icon {
    width: 34px;
    height: 34px;
    margin-bottom: 10px;
    color: var(--text-muted);
  }

  .option-card.selected .device-icon {
    color: var(--blue);
  }

  .option-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .option-card .desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 10px;
    min-height: 32px;
  }

  .badge-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .conn-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1px solid currentColor;
    background: transparent;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .conn-badge.matter { color: #12100b; font-weight: 700; }
  .conn-badge.wifi { color: #0b6bcb; }
  .conn-badge.ble { color: #4338ca; }
  .conn-badge.thread { color: #1a7f37; }
  /* Deliberately more muted than the others — this badge documents a
     hardware capability the firmware in this repo never actually uses
     (see the comment on CONN_LABELS.zigbee), so it shouldn't look as
     "active"/prominent as a badge for a transport this repo really builds. */
  .conn-badge.zigbee { color: #8a6d00; opacity: 0.75; }

  .option-card.selected .conn-badge {
    background: #ffffff;
  }

  .note-box {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .note-box code {
    background: #eef1f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ---------- Configure Device ---------- */

  .configure-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }

  /* Device types with a checkable picker on this step (componentOptions'
     sensor-model list, or extraButtons' button-count list) get a third
     column: the picker sits to the left of the main panel, mirroring the
     Configuration summary sidebar's position on the right, at roughly the
     same width. Only one of the two ever applies to a given device type
     today, but both use this same modifier/layout. */
  .configure-grid.has-left-sidebar {
    grid-template-columns: 240px 2fr 1fr;
  }

  @media (max-width: 960px) {
    .configure-grid.has-left-sidebar { grid-template-columns: 1fr 1fr; }
    .configure-grid.has-left-sidebar .step-panel { grid-column: 1 / -1; order: -1; }
  }

  @media (max-width: 720px) {
    .configure-grid,
    .configure-grid.has-left-sidebar { grid-template-columns: 1fr; }
    .configure-grid.has-left-sidebar .step-panel { grid-column: auto; order: 0; }
  }

  .driver-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 4px;
  }

  .driver-block h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  input[type="number"] {
    width: 100%;
    max-width: 200px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }

  /* Checkable list styling, shared by the sensor-model picker (a checkable
     list replacing a plain <select> so every option's bus/verified status
     is visible at a glance) and the switch's button-count picker below —
     both live in their own left sidebar (.config-sidebar.has-left-sidebar
     below), not inside .driver-block. */
  .component-list {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .component-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .component-list-item:last-child { border-bottom: none; }
  .component-list-item:hover { background: #f8fafc; }
  .component-list-item.selected { background: #f5f8ff; }

  .component-list-item input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .component-list-item .tick {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
    background: #fff;
  }

  .component-list-item.selected .tick {
    border-color: var(--blue);
    background: var(--blue);
    color: #fff;
  }

  .component-list-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .component-name {
    font-size: 13px;
    font-weight: 600;
  }

  .component-bus {
    font-size: 11px;
    color: var(--text-muted);
  }

  .config-sidebar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .config-sidebar h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .summary-row {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .summary-row:first-of-type { border-top: none; }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .summary-value {
    font-size: 14px;
    font-weight: 600;
  }

  .summary-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---------- Test Product ---------- */

  .warn-box {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #f3caca;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .serial-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .serial-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .serial-controls select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }

  .status-dot {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: auto;
  }

  .status-dot.connected { color: #1a7f37; }

  .serial-log {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    border-radius: 8px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  /* ---------- Customise & Review ---------- */

  .review-grid {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 20px;
    margin-bottom: 8px;
  }

  .review-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }

  .review-row:first-child { border-top: none; }

  .code-block-wrap { margin-bottom: 14px; }

  .code-block-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .code-block {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0;
    white-space: pre;
  }

  .copy-feedback {
    margin-left: 10px;
    font-size: 12px;
    color: #1a7f37;
  }

</style>
</head>
<body>

<header class="topbar">
  <div class="logo">esp32-<span>matter</span></div>
  <div class="tagline">Product Wizard — local, offline, no cloud</div>
</header>

<main id="app"></main>

<footer class="app-footer">Achim Pieters &middot; Copyright &copy; 2026 StudioPieters. Alle rechten voorbehouden. &middot; version 0.0.0</footer>

<script>
/*
 * Plain client-side state machine, no build step, no external dependencies.
 * Product data lives only in the browser's localStorage — nothing is sent
 * anywhere. All six wizard steps (Get Started through Generate Firmware)
 * are implemented; "generating" means producing ready-to-run commands you
 * copy and run yourself — this tool never writes to the repo directly.
 */

const STORAGE_KEY = "esp32matter.products";

// Same image + tag as tools/dev.sh, pinned to esp-matter's own recommended
// ESP-IDF version (v5.5.4) for reproducible builds — esp-matter doesn't
// support ESP-IDF v6.0.x yet. See CLAUDE.md before bumping this.
const ESP_MATTER_IMAGE = "espressif/esp-matter:release-v1.6_idf_v5.5.4";

const WIZARD_STEPS = [
  "Get Started",
  "Select Module",
  "Configure Device",
  "Test Product",
  "Customise & Review",
  "Generate Firmware",
];

/* Shared registry of physical components (sensor chips today; light
 * sources like relays/LEDs/LED strips are the anticipated next use —
 * see the comment on `componentOptions` below) that a device type can
 * offer a choice between. Defined once here rather than inline per
 * device type, so a component usable by more than one device type (e.g.
 * a relay module driving both an outlet and a future on/off light
 * variant) doesn't need its metadata duplicated and kept in sync by
 * hand in two places. Keyed by id; a DEVICE_TYPES entry lists which ids
 * apply to it via `componentOptions: [id, id, ...]` instead of embedding
 * full component objects.
 *
 * `verified: true` means hardware-tested in this repo specifically —
 * not a trustworthiness ranking of the driver code itself, which is
 * written to the same standard either way (see each driver's own
 * comment in the relevant app_main.cpp for exactly what was checked and
 * against which datasheet/reference source before writing timing- or
 * protocol-critical code). */
const COMPONENT_LIBRARY = {
  SHT3X: { name: "SHT3x", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: true, defineValue: "SENSOR_SHT3X" },
  SHT4X: { name: "SHT4x", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_SHT4X" },
  AHT20: { name: "AHT20", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_AHT20" },
  DHT11: { name: "DHT11", category: "temp-humidity", bus: "single-wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: true, defineValue: "SENSOR_DHT11" },
  DHT22: { name: "DHT22", category: "temp-humidity", bus: "single-wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: true, defineValue: "SENSOR_DHT22" },
  DS18B20: { name: "DS18B20 (temperature only)", category: "temp-humidity", bus: "1-Wire", pin1Label: "DATA", pin2Label: null, usesPin2: false, verified: false, defineValue: "SENSOR_DS18B20" },
  BME280: { name: "BME280", category: "temp-humidity", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "SENSOR_BME280" },
  LDR: { name: "LDR / photoresistor", category: "light", bus: "ADC", pin1Label: "ADC", pin2Label: null, usesPin2: false, verified: false, defineValue: "LIGHT_SENSOR_LDR", note: "Needs an ADC1-capable GPIO (32-39 on classic ESP32) — the driver is hardcoded to GPIO 34/ADC1 channel 6; see LIGHT_SENSOR_ADC_CHANNEL in app_main.cpp if you use a different ADC1 pin." },
  BH1750: { name: "BH1750", category: "light", bus: "I2C", pin1Label: "SDA", pin2Label: "SCL", usesPin2: true, verified: false, defineValue: "LIGHT_SENSOR_BH1750", note: "Needs bidirectional I2C-capable GPIOs — avoid GPIO 32-39 (input-only on classic ESP32, can't do I2C). GPIO 21/22 are good defaults, same as the temperature sensor's I2C pins." },
  // Contact sensor components — deliberately cosmetic, no defineValue: a
  // reed switch, a Hall-effect IC, and a plain mechanical microswitch are
  // all, from app_main.cpp's point of view, just "read one GPIO, HIGH or
  // LOW" — there's no protocol/command-set difference the way there is
  // between temperature or light sensor chips, so there's nothing for a
  // sed command to actually switch. Listed anyway, on request, purely so
  // Configure Device looks and behaves consistently across every sensor-
  // style device type — see contact's `componentsPurelyVisual` flag below
  // for where that's made explicit to the person using the wizard too.
  REED_SWITCH: { name: "Reed Switch (magnetic)", category: "contact", bus: "GPIO", pin1Label: "Contact", pin2Label: null, usesPin2: false, verified: true },
  HALL_SENSOR: { name: "Hall-Effect Sensor (e.g. A3144, US5881)", category: "contact", bus: "GPIO", pin1Label: "Contact", pin2Label: null, usesPin2: false, verified: false },
  MICROSWITCH: { name: "Microswitch / mechanical contact", category: "contact", bus: "GPIO", pin1Label: "Contact", pin2Label: null, usesPin2: false, verified: false },
  // Outlet's Power Monitoring picker (see its DEVICE_TYPES entry's
  // `extraPickers`, a different mechanism from `componentOptions` above —
  // this choice doesn't affect any GPIO field's label the way a sensor's
  // pin1Label does, so it's deliberately kept out of the
  // componentOptions/driverLabel code path rather than shoehorned into it.
  // (There used to also be an Output-type LED/RELAY_OUTPUT pair of entries
  // here, for an Output picker removed after real-world feedback — see
  // the comment on outlet's DEVICE_TYPES `extraPickers` for why.)
  // `pins`: the GPIO(s) that chip's driver actually reads/drives in
  // firmware/outlet/main/app_main.cpp, shown as extra numeric fields in
  // Configure Device once that chip is selected (see renderConfigureDevice's

function findDeviceType(id) {
  return DEVICE_TYPES.find((d) => d.id === id) || null;
}

// Looks up a component (sensor chip, and eventually light-source parts
// like relays/LEDs) from the shared COMPONENT_LIBRARY by id, merging the
// id itself into the returned object for convenience at call sites.
function findComponent(id) {
  const c = COMPONENT_LIBRARY[id];
  return c ? { id, ...c } : null;
}

const state = {
  screen: "dashboard", // "dashboard" | "setup" | "wizard"
  products: loadProducts(),
  currentProduct: null,
};

function loadProducts() {
  try {
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    // Migrate products saved before device types were generalised: the LED
    // GPIO field used to be called ledGpio specifically.
    products.forEach((p) => {
      if (p.gpioPin == null && p.ledGpio != null) p.gpioPin = p.ledGpio;
    });
    return products;
  } catch (e) {
    return [];
  }
}

function saveProducts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.products));
}

function goTo(screen) {
  state.screen = screen;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "dashboard") app.innerHTML = renderDashboard();
  else if (state.screen === "setup") app.innerHTML = renderSetup();
  else if (state.screen === "wizard") app.innerHTML = renderWizard();
  bindEvents();
}

/* ---------- Dashboard ---------- */

function renderDashboard() {
  const cards = state.products
    .map(
      (p) => `
      <div class="product-card" data-open-product="${p.id}">
        <button class="delete-btn" data-delete-product="${p.id}" title="Delete product" aria-label="Delete ${escapeHtml(p.name)}">&times;</button>
        <h3>${escapeHtml(p.name)}</h3>
        <div class="meta">
          ${moduleName(p.target) !== "—" ? escapeHtml(moduleName(p.target)) + " · " : ""}Step: ${WIZARD_STEPS[p.step]}
        </div>
      </div>`
    )
    .join("");

  const grid = state.products.length
    ? `<div class="product-grid">${cards}</div>`
    : `<div class="empty-state">No products yet. Create your first one to get started.</div>`;

  return `
    <div class="dashboard-head">
      <div>
        <h1>Your products</h1>
        <p>Configure Matter devices for the esp32-matter toolkit — everything stays on this machine.</p>
      </div>
      <button class="primary" id="create-product-btn">+ Create a new product</button>
    </div>
    ${grid}
  `;
}

  const p = state.currentProduct;
  const stepsHtml = WIZARD_STEPS.map((label, i) => {
    const cls = i < p.step ? "done" : i === p.step ? "active" : "";
    const marker = i < p.step ? "&#10003;" : i + 1;
    const sep = i < WIZARD_STEPS.length - 1 ? `<span class="step-sep">&rsaquo;</span>` : "";
    return `<div class="step ${cls}"><span class="dot">${marker}</span>${escapeHtml(label)}</div>${sep}`;
  }).join("");

  let content;
  if (p.step === 0) content = renderGetStarted(p);
  else if (p.step === 1) content = renderSelectModule(p);
  else if (p.step === 2) content = renderConfigureDevice(p);
  else if (p.step === 3) content = renderTestProduct(p);
  else if (p.step === 4) content = renderCustomiseReview(p);
  else if (p.step === 5) content = renderGenerateFirmware(p);
  else content = `<div class="wizard-panel"><p>Unknown step.</p></div>`;

  return `<div class="stepper">${stepsHtml}</div>${content}`;
}

function renderGetStarted(p) {
  // Auto-select the only device type there is today — future types will
  // require an explicit click once DEVICE_TYPES has more than one entry.
  if (!p.deviceType && DEVICE_TYPES.length === 1) p.deviceType = DEVICE_TYPES[0].id;

  const cards = DEVICE_TYPES.map((d) => {
    const selected = p.deviceType === d.id;
    const icon = DEVICE_TYPE_ICONS[d.id] || "";
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-device-type="${d.id}" title="${escapeHtml(d.desc)}">
        <div class="device-icon" aria-hidden="true">${icon}</div>
        <h3>${escapeHtml(d.name)}</h3>
        <p class="desc">${escapeHtml(d.shortDesc || d.desc)}</p>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose your device</h2>
      <p class="step-hint">What kind of Matter device is "${escapeHtml(p.name)}"?</p>
      <div class="option-grid">${cards}</div>
      <p class="note-box">
        Every option above maps to a real, buildable folder under
        <code>firmware/</code> — none of these are UI placeholders. Adding
        another device type means copying one of those folders and
        swapping its endpoint type, per CLAUDE.md.
      </p>
      ${renderWizardFooter(p, !!p.deviceType)}
    </div>
  `;
}

function renderSelectModule(p) {
  const cards = MODULES.map((m) => {
    const selected = p.target === m.id;
    // "Matter" isn't part of `conn` — every module listed in this wizard is
    // Matter-capable by definition (that's the entire point of the repo),
    // so it's always shown first rather than repeated in every entry's conn
    // array.
    const matterBadge = `<span class="conn-badge matter" title="This module builds and runs Matter firmware.">${escapeHtml(MATTER_BADGE_LABEL)}</span>`;
    const badges = m.conn
      .map((c) => `<span class="conn-badge ${c}" title="${escapeHtml(CONN_LABELS[c].title)}">${escapeHtml(CONN_LABELS[c].label)}</span>`)
      .join("");
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-module="${m.id}">
        <h3>${escapeHtml(m.name)}</h3>
        <p class="desc">${escapeHtml(m.desc)}</p>
        <div class="badge-row">${matterBadge}${badges}</div>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose an ESP module</h2>
      <p class="step-hint">Which chip will "${escapeHtml(p.name)}" run on? This maps to <code>idf.py set-target</code>.</p>
      <div class="option-grid">${cards}</div>
      ${renderWizardFooter(p, !!p.target)}
    </div>
  `;
}

// Old saved products predate this field entirely, so "enabled" has to be
// the default for undefined too — only an explicit false means off.
function identifyIsEnabled(p) {
  return p.identifyEnabled !== false;
}

// Status LED (currently outlet-only): opposite default from Identify above
// — off unless explicitly turned on — since not every board has this
// separate on/off indicator LED wired up at all, unlike Identify which
// every device type ships with.
function statusLedIsEnabled(p) {
  return p.statusLedEnabled === true;
}

function renderConfigureDevice(p) {
  const deviceType = findDeviceType(p.deviceType);
  const driver = deviceType ? deviceType.driver : null;
  const secondary = deviceType ? deviceType.secondary : null;
  const identify = deviceType ? deviceType.identify : null;
  const statusLed = deviceType ? deviceType.statusLed : null;
  const componentOptions = deviceType ? deviceType.componentOptions : null;
  const extraButtons = deviceType ? deviceType.extraButtons : null;
  const extraPickers = deviceType ? deviceType.extraPickers : null;
  const defaultGpio = driver ? (driver.defaultsByModule[p.target] != null ? driver.defaultsByModule[p.target] : 2) : 2;
  const defaultSecondaryGpio = secondary ? (secondary.defaultsByModule[p.target] != null ? secondary.defaultsByModule[p.target] : 4) : 4;
  const defaultIdentifyGpio = identify ? (identify.defaultsByModule[p.target] != null ? identify.defaultsByModule[p.target] : 4) : 4;
  const identifyOn = identifyIsEnabled(p);
  const defaultStatusLedGpio = statusLed ? (statusLed.defaultsByModule[p.target] != null ? statusLed.defaultsByModule[p.target] : 5) : 5;
  const statusLedOn = statusLed ? statusLedIsEnabled(p) : false;

  if (componentOptions && p.component == null) p.component = componentOptions[0];
  const selectedComponent = componentOptions ? (findComponent(p.component) || findComponent(componentOptions[0])) : null;

  // extraPickers (currently just the outlet's Output-type + Power-Monitoring
  // chip choices): a list of independent enum-like pickers, each keyed by
  // its own state field (picker.key) rather than the single shared
  // p.component componentOptions uses — deliberately separate from
  // componentOptions since these choices don't drive driverLabel/
  // secondaryFieldNeeded pin-naming the way a sensor-model choice does.
  // A selected component can also carry its own `pins` array (currently
  // just the power-monitor chips) — those get defaulted into
  // p.pickerPins, keyed by each pin's defineName (globally unique across
  // chips, since HLW8012/CSE7759 intentionally share BL0937's
  // PULSE_METER_* names — see the comment in COMPONENT_LIBRARY).
  if (extraPickers) {
    if (typeof p.pickerPins !== "object" || p.pickerPins == null) p.pickerPins = {};
    extraPickers.forEach((picker) => {
      if (p[picker.key] == null) p[picker.key] = picker.options[0];
      const selected = findComponent(p[picker.key]);
      if (selected && Array.isArray(selected.pins)) {
        selected.pins.forEach((pin) => {
          if (p.pickerPins[pin.defineName] == null) {
            p.pickerPins[pin.defineName] = pin.defaultsByModule[p.target] != null ? pin.defaultsByModule[p.target] : 0;
          }
        });
      }
    });
  }
  // Every pin field currently active across all extraPickers (e.g. both of
  // BL0942's UART pins, or ADE7953's SDA/SCL) — flattened once so
  // rendering/validation/summary don't each need their own copy of this walk.
  const activePickerPins = extraPickers
    ? extraPickers.flatMap((picker) => {
        const selected = findComponent(p[picker.key]);
        return selected && Array.isArray(selected.pins) ? selected.pins.map((pin) => ({ picker, pin })) : [];
      })
    : [];
  const pickerPinsValid = activePickerPins.every(({ pin }) =>
    Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);

  // Multi-button (currently just the switch): button 1 is always the
  // existing `driver` field, unchanged, so single-button products (every
  // switch created before this feature existed) keep working with zero
  // migration. Buttons 2+ are extraButtons, shown/sed'd up to whatever
  // buttonCount is set to (1 = just button 1, same as before this feature
  // existed at all).
  // A device type can use `extraButtons` two ways: a real variable count
  // the user picks (switch's 1-4 buttons — has `buttonCountDefineName`,
  // so the count gets its own sed line), or a fixed set of GPIO fields
  // that are just always all shown/sed'd (e.g. firmware/color-light/'s
  // Green/Blue channels alongside `driver`'s Red — there's no real "how
  // many" choice, it's always all of them). No `buttonCountDefineName`
  // on the device type is the signal for the fixed case.
  const maxButtons = extraButtons ? extraButtons.length + 1 : 1;
  const hasVariableButtonCount = extraButtons && !!(deviceType && deviceType.buttonCountDefineName);
  if (extraButtons) {
    if (hasVariableButtonCount) {
      if (!Number.isInteger(p.buttonCount) || p.buttonCount < 1 || p.buttonCount > maxButtons) p.buttonCount = 1;
    } else {
      p.buttonCount = maxButtons;
    }
    if (!Array.isArray(p.buttonGpios)) p.buttonGpios = [];
  }
  const buttonCount = extraButtons ? p.buttonCount : 1;
  const activeExtraButtons = extraButtons ? extraButtons.slice(0, buttonCount - 1) : [];
  activeExtraButtons.forEach((b, i) => {
    if (p.buttonGpios[i] == null) {
      p.buttonGpios[i] = b.defaultsByModule[p.target] != null ? b.defaultsByModule[p.target] : b.currentGpio;
    }
  });
  const extraButtonsValid = activeExtraButtons.every((b, i) => Number.isInteger(p.buttonGpios[i]) && p.buttonGpios[i] >= 0);

  if (p.gpioPin == null) p.gpioPin = defaultGpio;
  if (secondary && p.secondaryGpioPin == null) p.secondaryGpioPin = defaultSecondaryGpio;
  if (p.identifyGpioPin == null) p.identifyGpioPin = defaultIdentifyGpio;
  const gpioValid = Number.isInteger(p.gpioPin) && p.gpioPin >= 0;
  const secondaryGpioValid = !secondary || (Number.isInteger(p.secondaryGpioPin) && p.secondaryGpioPin >= 0);
  const identifyGpioValid = !identifyOn || (Number.isInteger(p.identifyGpioPin) && p.identifyGpioPin >= 0);
  const sameGpio = identifyOn && gpioValid && identifyGpioValid && p.gpioPin === p.identifyGpioPin;
  if (statusLed && p.statusLedGpioPin == null) p.statusLedGpioPin = defaultStatusLedGpio;
  const statusLedGpioValid = !statusLedOn || (Number.isInteger(p.statusLedGpioPin) && p.statusLedGpioPin >= 0);
  const allValid = gpioValid && secondaryGpioValid && identifyGpioValid && extraButtonsValid && statusLedGpioValid && pickerPinsValid;

  // Component-aware field labels: falls back to the device type's own
  // static text when there's no componentOptions list (every device type
  // except the temperature sensor, for now) so this doesn't change
  // anything for the others.
  const driverLabel = selectedComponent ? `${selectedComponent.pin1Label} GPIO pin` : (driver ? driver.fieldLabel : "GPIO pin");
  const driverBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin1Label}` : (driver ? driver.blockTitle : "GPIO");
  const secondaryLabel = selectedComponent ? `${selectedComponent.pin2Label || "Pin 2"} GPIO pin` : (secondary ? secondary.fieldLabel : "");
  const secondaryBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin2Label || "pin 2"}` : (secondary ? secondary.blockTitle : "");
  // Sensors picked via componentOptions that only need one data pin
  // (single-wire/1-Wire/ADC — usesPin2: false in COMPONENT_LIBRARY) don't
  // need the "pin 2" field shown at all — showing an editable GPIO field
  // for a pin the driver never reads was confusing (real bug report: it
  // looked required). Device types with a `secondary` field but no
  // componentOptions (e.g. outlet's Button) are unaffected — there's no
  // selectedComponent to consult, so this only hides the field, it never
  // changes whether secondaryGpioPin itself gets defaulted/validated.
  const secondaryFieldNeeded = !!secondary && !(selectedComponent && !selectedComponent.usesPin2);

  return `
    <div class="configure-grid ${componentOptions || hasVariableButtonCount || (extraPickers && extraPickers.length) ? "has-left-sidebar" : ""}">
      ${componentOptions ? `
        <div class="config-sidebar">
          <h3>Sensor model</h3>
          <p class="field-label">Which sensor do you have wired up?</p>
          <div class="component-list" role="radiogroup" aria-label="Sensor model">
            ${componentOptions.map(findComponent).map((s) => `
              <label class="component-list-item ${s.id === selectedComponent.id ? "selected" : ""}">
                <input type="radio" name="sensor-model" value="${escapeHtml(s.id)}" ${s.id === selectedComponent.id ? "checked" : ""}>
                <span class="tick">&#10003;</span>
                <span class="component-list-item-text">
                  <span class="component-name">${escapeHtml(s.name)}</span>
                  <span class="component-bus">${escapeHtml(s.bus)}${s.verified ? "" : " · unverified"}</span>
                </span>
              </label>
            `).join("")}
          </div>
          <p class="field-note">
            ${deviceType.componentsPurelyVisual
              ? `Cosmetic choice only — every option here compiles to the exact same driver in app_main.cpp (a contact sensor is always just HIGH or LOW to the microcontroller, regardless of which physical part you wire up). Picking one doesn't change the generated firmware; it's here for visual consistency with the sensor pickers other device types have.${selectedComponent.verified ? ` This specific part is the one actually wired up and tested on real hardware in this repo.` : ` This specific part hasn't been physically tried here — though since the driver is identical either way, that's a much smaller gap than it is for a genuinely different sensor chip.`}`
              : (selectedComponent.verified
                ? `Verified on real hardware in this repo.`
                : `Implemented from the sensor's datasheet/reference driver, but not personally tested on real hardware in this repo — see the comment above its section in ${escapeHtml(driver ? driver.filePath : "app_main.cpp")} for exactly what was checked.`)}
            ${secondary && !selectedComponent.usesPin2 ? ` This sensor only needs one data pin (${escapeHtml(selectedComponent.pin1Label)}) — the "pin 2" field is hidden since its driver doesn't use it.` : ""}
            ${selectedComponent.note ? ` ${escapeHtml(selectedComponent.note)}` : ""}
          </p>
        </div>
      ` : (hasVariableButtonCount ? `
        <div class="config-sidebar">
          <h3>How many buttons?</h3>
          <p class="field-label">Each button becomes its own independently-bindable switch endpoint</p>
          <div class="component-list" role="radiogroup" aria-label="How many buttons?">
            ${Array.from({ length: maxButtons }, (_, i) => i + 1).map((n) => `
              <label class="component-list-item ${n === buttonCount ? "selected" : ""}">
                <input type="radio" name="button-count" value="${n}" ${n === buttonCount ? "checked" : ""}>
                <span class="tick">&#10003;</span>
                <span class="component-list-item-text">
                  <span class="component-name">${n} button${n === 1 ? "" : "s"}</span>
                </span>
              </label>
            `).join("")}
          </div>
          <p class="field-note">
            ${buttonCount === 1
              ? `A single button, same as this device type has always had — its Identify LED also doubles as a local on/off indicator (see below).`
              : `${buttonCount} independent buttons, each its own on_off_light_switch endpoint — bind each one to a different device through your controller's Bindings UI. With more than one button, the Identify LED no longer doubles as an on/off indicator (there's no longer one single "switch state" it could represent).`}
          </p>
        </div>
      ` : (extraPickers && extraPickers.length ? `
        <div class="config-sidebar">
          ${extraPickers.map((picker) => {
            const selected = findComponent(p[picker.key]) || findComponent(picker.options[0]);
            return `
              <h3>${escapeHtml(picker.label)}</h3>
              <p class="field-label">${escapeHtml(picker.prompt)}</p>
              <div class="component-list" role="radiogroup" aria-label="${escapeHtml(picker.label)}">
                ${picker.options.map(findComponent).map((s) => `
                  <label class="component-list-item ${s.id === selected.id ? "selected" : ""}">
                    <input type="radio" name="picker-${escapeHtml(picker.key)}" value="${escapeHtml(s.id)}" data-picker-key="${escapeHtml(picker.key)}" ${s.id === selected.id ? "checked" : ""}>
                    <span class="tick">&#10003;</span>
                    <span class="component-list-item-text">
                      <span class="component-name">${escapeHtml(s.name)}</span>
                      <span class="component-bus">${escapeHtml(s.bus)}${s.verified ? "" : " · unverified"}</span>
                    </span>
                  </label>
                `).join("")}
              </div>
              <p class="field-note">
                ${selected.verified ? `Verified on real hardware in this repo.` : `Not personally tested on real hardware in this repo — build-verified only.`}
                ${selected.note ? ` ${escapeHtml(selected.note)}` : ""}
              </p>
            `;
          }).join('<hr style="margin:20px 0;border:none;border-top:1px solid var(--border);">')}
        </div>
      ` : ""))}

      <div class="step-panel">
        <h2>Configure device</h2>
        <p class="step-hint">Set the driver options for this ${escapeHtml(deviceTypeName(p.deviceType))} on ${escapeHtml(moduleName(p.target))}.</p>

        <div class="driver-block">
          <h3>${escapeHtml(driverBlockTitle)}</h3>
          <label class="field-label" for="gpio-pin">${escapeHtml(driverLabel)}</label>
          <input type="number" id="gpio-pin" min="0" max="48" value="${p.gpioPin}">
          <div class="field-error">${gpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
          <p class="field-note">
            Adjust to match your board — GPIO ${defaultGpio}
            is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
          </p>
        </div>

        ${activeExtraButtons.map((b, i) => `
          <div class="driver-block">
            <h3>${escapeHtml(b.blockTitle)}</h3>
            <label class="field-label" for="extra-button-gpio-${i}">${escapeHtml(b.fieldLabel)}</label>
            <input type="number" id="extra-button-gpio-${i}" min="0" max="48" value="${p.buttonGpios[i]}">
            <div class="field-error">${Number.isInteger(p.buttonGpios[i]) && p.buttonGpios[i] >= 0 ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
            <p class="field-note">
              Adjust to match your board — GPIO ${b.defaultsByModule[p.target] != null ? b.defaultsByModule[p.target] : b.currentGpio}
              is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
            </p>
          </div>
        `).join("")}

        ${secondaryFieldNeeded ? `
          <div class="driver-block">
            <h3>${escapeHtml(secondaryBlockTitle)}</h3>
            <label class="field-label" for="secondary-gpio-pin">${escapeHtml(secondaryLabel)}</label>
            <input type="number" id="secondary-gpio-pin" min="0" max="48" value="${p.secondaryGpioPin}">
            <div class="field-error">${secondaryGpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
            <p class="field-note">
              Adjust to match your board — GPIO ${defaultSecondaryGpio}
              is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
            </p>
          </div>
        ` : ""}

        ${extraPickers ? extraPickers.map((picker) => {
          const selected = findComponent(p[picker.key]);
          if (!selected || !Array.isArray(selected.pins) || !selected.pins.length) return "";
          return `
            <div class="driver-block">
              <h3>${escapeHtml(picker.label)} · ${escapeHtml(selected.name)} (${escapeHtml(selected.bus)})</h3>
              ${selected.pins.map((pin) => `
                <label class="field-label" for="picker-pin-${escapeHtml(pin.defineName)}">${escapeHtml(pin.label)} GPIO pin</label>
                <input type="number" id="picker-pin-${escapeHtml(pin.defineName)}" data-pin-define="${escapeHtml(pin.defineName)}" min="0" max="48" value="${p.pickerPins[pin.defineName]}" style="margin-bottom:12px;">
                <div class="field-error">${Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0 ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
              `).join("")}
              <p class="field-note">
                Adjust to match your board — these defaults are common for
                ${escapeHtml(moduleName(p.target))} devkits, not a guarantee
                for yours. Wiring/protocol details for ${escapeHtml(selected.name)}
                are in the comment above its section in
                ${escapeHtml(driver ? driver.filePath : "app_main.cpp")}.
              </p>
            </div>
          `;
        }).join("") : ""}

        ${statusLed ? `
          <div class="driver-block">
            <label class="checkbox-label" for="status-led-enabled">
              <input type="checkbox" id="status-led-enabled" ${statusLedOn ? "checked" : ""}>
              <h3 style="display:inline; margin:0;">Add a Status LED</h3>
            </label>
            <p class="field-note" style="margin-top:4px;">
              A separate indicator LED some plug/outlet hardware has, wired
              to its own GPIO, that continuously mirrors the outlet's actual
              on/off state — different from the Identify LED below, which
              only blinks temporarily on an Identify command. Off by
              default since not every board has one; the firmware ships
              this pin disabled (<code>GPIO_NUM_NC</code>) until you tick
              this and set a real pin.
            </p>

            ${statusLedOn ? `
              <label class="field-label" for="status-led-gpio-pin" style="margin-top:12px;">${escapeHtml(statusLed.fieldLabel)}</label>
              <input type="number" id="status-led-gpio-pin" min="0" max="48" value="${p.statusLedGpioPin}">
              <div class="field-error">${statusLedGpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
              <p class="field-note">
                Adjust to match your board — GPIO ${defaultStatusLedGpio}
                is a common default for ${escapeHtml(moduleName(p.target))} devkits, not a guarantee for yours.
              </p>
            ` : ""}
          </div>
        ` : ""}

        <div class="driver-block">
          <label class="checkbox-label" for="identify-enabled">
            <input type="checkbox" id="identify-enabled" ${identifyOn ? "checked" : ""}>
            <h3 style="display:inline; margin:0;">Add an Identify LED</h3>
          </label>
          <p class="field-note" style="margin-top:4px;">
            Blinks when a controller sends an "Identify" command, so you
            can physically find this device.${p.deviceType === "switch" ? " On this switch it also doubles as a local on/off indicator, flipping with every confirmed button press — handy since the switch's actual Matter state lives on whatever device it's bound to, not on the switch itself." : ""}
            On by default; untick to
            leave it out of this product (the firmware's shipped default
            stays as-is, this just means the wizard won't customise it).
          </p>

          ${identifyOn ? `
            <label class="field-label" for="identify-gpio-pin" style="margin-top:12px;">${escapeHtml(identify ? identify.fieldLabel : "Identify LED GPIO pin")}</label>
            <input type="number" id="identify-gpio-pin" min="0" max="48" value="${p.identifyGpioPin}">
            <div class="field-error">${identifyGpioValid ? "" : "Enter a valid GPIO number (0 or higher)."}</div>
            <p class="field-note">
              Pick a GPIO different from
              ${escapeHtml(driver ? driver.fieldLabel.replace(" pin", "").toLowerCase() : "the driver pin")}
              above unless you deliberately want them to share one LED
              (GPIO ${defaultIdentifyGpio} is this repo's default, not a
              guarantee for your board).
            </p>
            ${sameGpio ? `<div class="field-warning">&#9888; Same GPIO as above — that LED will also blink during identify, on top of whatever it's already doing.</div>` : ""}
          ` : ""}
        </div>

        <p class="note-box">
          This only records your choices for now — it doesn't edit
          <code>${escapeHtml(driver ? driver.filePath : "app_main.cpp")}</code> yet. Applying them
          (replacing <code>${escapeHtml(driver ? driver.defineName : "")}</code>${activeExtraButtons.map((b) => `,
          <code>${escapeHtml(b.defineName)}</code>`).join("")}${hasVariableButtonCount ? `,
          <code>${escapeHtml(deviceType.buttonCountDefineName)}</code>` : ""}${secondary ? `,
          <code>${escapeHtml(secondary.defineName)}</code>${secondaryFieldNeeded ? "" : " (kept at its default — unused by this sensor)"}` : ""}${statusLedOn ? `,
          <code>${escapeHtml(statusLed.defineName)}</code>` : ""}${identifyOn ? `,
          <code>${escapeHtml(identify ? identify.defineName : "IDENTIFY_LED_GPIO")}</code>` : ""}${activePickerPins.map(({ pin }) => `,
          <code>${escapeHtml(pin.defineName)}</code>`).join("")}) happens
          in the Generate Firmware step.
        </p>

        ${renderWizardFooter(p, allValid)}
      </div>

      <div class="config-sidebar">
        <h3>Configuration summary</h3>
        <div class="summary-row">
          <div class="summary-label">DEVICE</div>
          <div class="summary-value">${escapeHtml(deviceTypeName(p.deviceType))}</div>
        </div>
        <div class="summary-row">
          <div class="summary-label">MODULE</div>
          <div class="summary-value">${escapeHtml(moduleName(p.target))}</div>
        </div>
        <div class="summary-row">
          <div class="summary-label">${escapeHtml(extraButtons ? (deviceType.driverLabel || "DRIVER").toUpperCase() : "DRIVER")}</div>
          <div class="summary-value">${escapeHtml(selectedComponent ? `${selectedComponent.pin1Label} (${selectedComponent.bus})` : (driver ? driver.summary : "—"))}</div>
          <div class="summary-detail">IO pin: GPIO ${gpioValid ? p.gpioPin : "?"}</div>

/* Web Serial connection — deliberately kept outside the render/state cycle.
 * A full re-render would tear down and recreate the <pre> log element and
 * sever the read loop's reference to it, so connect/disconnect/log updates
 * touch the DOM directly instead of going through render(). */
const serialState = {
  supported: !!(navigator.serial),
  port: null,
  reader: null,
  connected: false,
};

async function connectSerial() {
  try {
    const port = await navigator.serial.requestPort();
    const baudSelect = document.getElementById("serial-baud");
    const baudRate = baudSelect ? parseInt(baudSelect.value, 10) : 115200;
    await port.open({ baudRate });
    serialState.port = port;
    serialState.connected = true;
    updateSerialUI();
    readSerialLoop(port);
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  }
}

async function readSerialLoop(port) {
  const decoder = new TextDecoderStream();
  const streamClosed = port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  serialState.reader = reader;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) appendSerialLog(value);
    }
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  } finally {
    reader.releaseLock();
    await streamClosed;
  }
}

async function disconnectSerial() {
  try {
    if (serialState.reader) await serialState.reader.cancel();
    if (serialState.port) await serialState.port.close();
  } catch (err) {
    // Port may already be gone (device unplugged) — nothing to do.
  }
  serialState.port = null;
  serialState.reader = null;
  serialState.connected = false;
  updateSerialUI();
}

function appendSerialLog(text) {
  const log = document.getElementById("serial-log");
  if (!log) return;
  log.textContent += text;
  log.scrollTop = log.scrollHeight;
}

function updateSerialUI() {
  const btn = document.getElementById("serial-connect-btn");
  const status = document.getElementById("serial-status");
  if (!btn || !status) return;
  btn.textContent = serialState.connected ? "Disconnect" : "Connect";
  status.textContent = serialState.connected ? "Connected" : "Not connected";
  status.classList.toggle("connected", serialState.connected);
}

/* Selection completeness, shared by Customise & Review and Generate
 * Firmware so they can't drift apart. */
function isProductComplete(p) {
  const deviceType = findDeviceType(p.deviceType);
  const identifyOk = !identifyIsEnabled(p) ||
    (Number.isInteger(p.identifyGpioPin) && p.identifyGpioPin >= 0);
  const secondaryOk = !(deviceType && deviceType.secondary) ||
    (Number.isInteger(p.secondaryGpioPin) && p.secondaryGpioPin >= 0);
  // Multi-button devices (currently just the switch): every button GPIO up
  // to the selected buttonCount has to be valid too — buttonCount itself
  // defaults to 1 (just the always-present `driver` field) whenever the
  // device type doesn't define extraButtons at all. Fixed-count devices
  // (extraButtons present but no buttonCountDefineName — see the comment
  // on hasVariableButtonCount in renderConfigureDevice, e.g.
  // firmware/color-light/'s Green/Blue channels) always need every field
  // valid, not just the first — computed independently here (not read
  // from p.buttonCount) so this validates correctly even if
  // renderConfigureDevice() hasn't run yet to default-fill it.
  const extraButtons = deviceType ? deviceType.extraButtons : null;
  const hasVariableButtonCount = extraButtons && !!(deviceType && deviceType.buttonCountDefineName);
  const maxButtons = extraButtons ? extraButtons.length + 1 : 1;
  const buttonCount = extraButtons
    ? (hasVariableButtonCount ? (Number.isInteger(p.buttonCount) ? p.buttonCount : 1) : maxButtons)
    : 1;
  const buttonsOk = !extraButtons || extraButtons.slice(0, buttonCount - 1).every((b, i) =>
    Array.isArray(p.buttonGpios) && Number.isInteger(p.buttonGpios[i]) && p.buttonGpios[i] >= 0);
  const statusLedOk = !(deviceType && deviceType.statusLed) || !statusLedIsEnabled(p) ||
    (Number.isInteger(p.statusLedGpioPin) && p.statusLedGpioPin >= 0);
  // Pins belonging to whichever component is currently selected on each
  // extraPicker (currently just the outlet's Power Monitoring chip) —
  // same "active selection only" shape as buttonsOk above.
  const extraPickers = deviceType ? deviceType.extraPickers : null;
  const pickerPinsOk = !extraPickers || extraPickers.every((picker) => {
    const selected = findComponent(p[picker.key]);
    if (!selected || !Array.isArray(selected.pins)) return true;
    return selected.pins.every((pin) =>
      p.pickerPins && Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);
  });
  return !!p.deviceType && !!p.target &&
    Number.isInteger(p.gpioPin) && p.gpioPin >= 0 &&
    secondaryOk && identifyOk && buttonsOk && statusLedOk && pickerPinsOk;
}

/* This page always lives at <repo>/tools/product-wizard/index.html when
 * opened the normal way (open tools/product-wizard/index.html). A file://
 * page can't browse your filesystem, but it CAN read its own location — so
 * instead of asking you to type your checkout path, or guessing where you
 * saved a downloaded file, we read it straight out of window.location and
 * bake the real absolute path into the generated command. Returns null if
 * the page isn't being served as file:// from that expected location (e.g.
 * you renamed the folder, or it's running off a web server). */
function detectRepoRoot() {
  if (window.location.protocol !== "file:") return null;
  const marker = "/tools/product-wizard/";
  const path = decodeURIComponent(window.location.pathname);
  const idx = path.indexOf(marker);
  return idx === -1 ? null : path.slice(0, idx);
}
