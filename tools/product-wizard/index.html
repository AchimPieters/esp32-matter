<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #e2e6ec;
    --bg: #f6f7f9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --card-bg: #ffffff;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header.topbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header.topbar .brand-mark {
    height: 26px;
    width: auto;
    flex-shrink: 0;
    fill: #cebb88;
  }

  header.topbar .logo {
    font-weight: 700;
    font-size: 16px;
  }

  header.topbar .logo span {
    color: var(--blue);
  }

  header.topbar .tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin-left: 4px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  footer.app-footer {
    border-top: 1px solid var(--border);
    padding: 16px 32px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  /* ---------- Dashboard ---------- */

  .dashboard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
  }

  .dashboard-head h1 {
    font-size: 24px;
    margin: 0 0 6px;
  }

  .dashboard-head p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  button.primary {
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  button.primary:hover { background: var(--blue-dark); }

  button.primary:disabled {
    background: #b9c2d0;
    cursor: not-allowed;
  }

  button.secondary {
    background: #fff;
    color: var(--blue);
    border: 1px solid var(--blue);
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.secondary:hover { background: #eef3ff; }

  button.link {
    background: none;
    border: none;
    color: var(--blue);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .product-card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
  }

  .product-card:hover { border-color: var(--blue); }

  .delete-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    border-radius: 6px;
    cursor: pointer;
  }

  .delete-btn:hover {
    background: #fdeeee;
    color: #c0392b;
  }

  .product-card h3 {
    margin: 0 0 4px;
    font-size: 15px;
  }

  .product-card .meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--text-muted);
  }

  /* ---------- Setup screen ---------- */

  .setup-wrap {
    max-width: 480px;
    margin: 60px auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
  }

  .setup-wrap h2 {
    margin: 0 0 6px;
    font-size: 20px;
  }

  .setup-wrap p.hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 8px;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-error {
    color: #c0392b;
    font-size: 12px;
    min-height: 16px;
    margin-bottom: 16px;
  }

  .field-warning {
    color: #9a6700;
    font-size: 12px;
    margin-bottom: 16px;
  }

  .setup-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  /* ---------- Wizard stepper ---------- */

  .stepper {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 24px;
    margin-bottom: 28px;
    overflow-x: auto;
    gap: 4px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
  }

  .step .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #d7dce3;
    color: #fff;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .step.done .dot { background: var(--blue); }
  .step.active .dot { background: var(--blue); }
  .step.active { color: var(--blue); }

  .step-sep {
    color: #c6cbd4;
    margin: 0 6px;
  }

  .wizard-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px;
    text-align: center;
  }

  .wizard-panel h2 {
    margin: 0 0 8px;
  }

  .wizard-panel p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 460px;
    margin: 0 auto 24px;
  }

  .wizard-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 24px;
  }

  /* ---------- Wizard step content (Get Started / Select Module) ---------- */

  .step-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  .step-panel h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }

  .step-panel > p.step-hint {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 13px;
  }

  .option-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }

  .option-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
  }

  .option-card:hover { border-color: var(--blue); }

  .option-card.selected {
    border-color: var(--blue);
    background: #f5f8ff;
  }

  /* Device-type icon — HomeKit-style rounded-square line art, one per
     DEVICE_TYPES entry (see DEVICE_TYPE_ICONS). Not used on the module
     picker's cards — those get a real product illustration instead (see
     .module-icon below), since a chip isn't a device category a
     HomeKit-style icon could represent. */
  .option-card .device-icon {
    width: 34px;
    height: 34px;
    margin-bottom: 10px;
    color: var(--text-muted);
  }

  .option-card.selected .device-icon {
    color: var(--blue);
  }

  /* Module-picker icon — a real illustration (see MODULES' own `icon`
     field + modules/*.svg), not hand-drawn line art like .device-icon
     above, so it's shown at real size/color rather than tinted via
     currentColor. Fixed-height box, image letterboxed inside it via
     object-fit — the source SVGs don't share one aspect ratio (compact
     modules like the ESP8684/ESP8685 boards are noticeably wider/
     shorter than e.g. the ESP32-S3's), so a fixed box keeps every card
     in the grid the same height regardless. */
  .option-card .module-icon {
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .option-card .module-icon img {
    max-width: 100%;
    max-height: 100%;
  }

  .option-card h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .option-card .desc {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 10px;
    min-height: 32px;
  }

  .badge-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .conn-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1px solid currentColor;
    background: transparent;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .conn-badge.matter { color: #12100b; font-weight: 700; }
  .conn-badge.wifi { color: #0b6bcb; }
  .conn-badge.ble { color: #4338ca; }
  .conn-badge.thread { color: #1a7f37; }
  /* Deliberately more muted than the others — this badge documents a
     hardware capability the firmware in this repo never actually uses
     (see the comment on CONN_LABELS.zigbee), so it shouldn't look as
     "active"/prominent as a badge for a transport this repo really builds. */
  .conn-badge.zigbee { color: #8a6d00; opacity: 0.75; }

  .option-card.selected .conn-badge {
    background: #ffffff;
  }

  .note-box {
    margin-top: 20px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .note-box code {
    background: #eef1f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  /* ---------- Configure Device ---------- */

  .configure-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    align-items: start;
  }

  /* Device types with a checkable picker on this step (componentOptions'
     sensor-model list, or extraButtons' button-count list) get a third
     column: the picker sits to the left of the main panel, mirroring the
     Configuration summary sidebar's position on the right, at roughly the
     same width. Only one of the two ever applies to a given device type
     today, but both use this same modifier/layout. */
  .configure-grid.has-left-sidebar {
    grid-template-columns: 240px 2fr 1fr;
  }

  @media (max-width: 960px) {
    .configure-grid.has-left-sidebar { grid-template-columns: 1fr 1fr; }
    .configure-grid.has-left-sidebar .step-panel { grid-column: 1 / -1; order: -1; }
  }

  @media (max-width: 720px) {
    .configure-grid,
    .configure-grid.has-left-sidebar { grid-template-columns: 1fr; }
    .configure-grid.has-left-sidebar .step-panel { grid-column: auto; order: 0; }
  }

  .driver-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 4px;
  }

  .driver-block h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }

  input[type="number"] {
    width: 100%;
    max-width: 200px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 4px;
  }

  input[type="number"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .field-note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 8px 0 0;
  }

  /* Checkable list styling, shared by the sensor-model picker (a checkable
     list replacing a plain <select> so every option's bus/verified status
     is visible at a glance) and the switch's button-count picker below —
     both live in their own left sidebar (.config-sidebar.has-left-sidebar
     below), not inside .driver-block. */
  .component-list {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .component-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
  }

  .component-list-item:last-child { border-bottom: none; }
  .component-list-item:hover { background: #f8fafc; }
  .component-list-item.selected { background: #f5f8ff; }

  .component-list-item input[type="radio"],
  .component-list-item input[type="checkbox"] {
    /* Same hidden-native-input treatment for both — a checkbox list
       (currently just air-quality's own optional-cluster picker) is a
       multi-select instead of a single-select radiogroup, but visually
       identical: a custom .tick square driven by the .selected class,
       not the native browser control. */
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .component-list-item .tick {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
    background: #fff;
  }

  .component-list-item.selected .tick {
    border-color: var(--blue);
    background: var(--blue);
    color: #fff;
  }

  .component-list-item-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .component-name {
    font-size: 13px;
    font-weight: 600;
  }

  .component-bus {
    font-size: 11px;
    color: var(--text-muted);
  }

  .config-sidebar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .config-sidebar h3 {
    margin: 0 0 16px;
    font-size: 14px;
  }

  /* Wraps the Configuration summary card + the Factory Reset card below it
     so both stack as one grid item — keeps them in the same column
     regardless of whether Configure Device also has a left sidebar
     (2-col vs. 3-col .configure-grid, see above). */
  .config-sidebar-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .factory-reset-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .factory-reset-box h3 {
    margin: 0 0 12px;
    font-size: 14px;
  }

  .factory-reset-box ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .factory-reset-box li {
    margin-bottom: 8px;
  }

  .factory-reset-box li:last-child {
    margin-bottom: 0;
  }

  .factory-reset-box code {
    background: #eef1f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
  }

  .summary-row {
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }

  .summary-row:first-of-type { border-top: none; }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .summary-value {
    font-size: 14px;
    font-weight: 600;
  }

  .summary-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---------- Test Product ---------- */

  .warn-box {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #f3caca;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .serial-panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .serial-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .serial-controls select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }

  .status-dot {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: auto;
  }

  .status-dot.connected { color: #1a7f37; }

  .serial-log {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px;
    border-radius: 8px;
    height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }

  /* ---------- Customise & Review ---------- */

  .review-grid {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 20px;
    margin-bottom: 8px;
  }

  .review-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }

  .review-row:first-child { border-top: none; }

  .code-block-wrap { margin-bottom: 14px; }

  .code-block-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .code-block {
    background: #0f1117;
    color: #d7e0ea;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0;
    white-space: pre;
  }

  .copy-feedback {
    margin-left: 10px;
    font-size: 12px;
    color: #1a7f37;
  }

</style>
</head>

<header class="topbar">
  <svg class="brand-mark" viewBox="0 0 19.14 38.29" role="img" aria-label="StudioPieters">
    <path d="M19.14,0v38.29H0v-8.13c6.08,0,11.01-4.93,11.01-11.02S6.08,8.13,0,8.13V0h19.14Z"/>
  </svg>
  <div class="logo">esp32-<span>matter</span></div>
  <div class="tagline">Product Wizard — local, offline, no cloud</div>
</header>

<main id="app"></main>

<footer class="app-footer">Achim Pieters &middot; Copyright &copy; 2026 StudioPieters. Alle rechten voorbehouden. &middot; version 0.0.0</footer>

<script>
/*
 * Plain client-side state machine, no build step, no external dependencies.
 * Product data lives only in the browser's localStorage — nothing is sent
 * anywhere. All six wizard steps (Get Started through Generate Firmware)
 * are implemented; "generating" means producing ready-to-run commands you
 * copy and run yourself — this tool never writes to the repo directly.
 */

const STORAGE_KEY = "esp32matter.products";

// Same image + tag as tools/dev.sh, pinned to esp-matter's own recommended
// ESP-IDF version (v5.5.4) for reproducible builds — esp-matter doesn't
// support ESP-IDF v6.0.x yet. See CLAUDE.md before bumping this.
const ESP_MATTER_IMAGE = "espressif/esp-matter:release-v1.6_idf_v5.5.4";

const WIZARD_STEPS = [
  "Get Started",
  "Select Module",
  "Configure Device",
  "Test Product",
  "Customise & Review",
  "Generate Firmware",
];

/* Shared registry of physical components (sensor chips today; light
 * sources like relays/LEDs/LED strips are the anticipated next use —
 * see the comment on `componentOptions` below) that a device type can
 * offer a choice between. Defined once here rather than inline per
 * device type, so a component usable by more than one device type (e.g.
 * a relay module driving both an outlet and a future on/off light
 * variant) doesn't need its metadata duplicated and kept in sync by
 * hand in two places. Keyed by id; a DEVICE_TYPES entry lists which ids
 * apply to it via `componentOptions: [id, id, ...]` instead of embedding
 * full component objects.
 *
 * `verified: true` means hardware-tested in this repo specifically —
 * not a trustworthiness ranking of the driver code itself, which is
 * written to the same standard either way (see each driver's own
 * comment in the relevant app_main.cpp for exactly what was checked and
 * against which datasheet/reference source before writing timing- or
 * protocol-critical code). */

/* Optional rotary encoder — firmware/thermostat/'s own local setpoint
 * control (see that file's header comment: rotate to adjust whichever
 * setpoint the current SystemMode uses, press to cycle Off -> Heat ->
 * Cool -> Off). Off by default, checked at runtime via GPIO_NUM_NC —
 * deliberately its own parallel field/render path rather than a shared
 * "array of optional pin blocks" mechanism — this repo's own established
 * convention (see CLAUDE.md) is copy-and-adapt over premature shared
 * abstraction, and only one device type needs this so far. */
function makeRotaryEncoder(aGpio, bGpio, buttonGpio) {
  const modules = ["esp32", "esp32c2", "esp32c3", "esp32c5", "esp32c6", "esp32c61", "esp32s3", "esp32h2"];
  const defaultsFor = (n) => Object.fromEntries(modules.map((m) => [m, n]));
  return {
    label: "Rotary Encoder",
    pins: [
      { key: "a", label: "A", defineName: "ROTARY_ENCODER_A_GPIO", defaultsByModule: defaultsFor(aGpio) },
      { key: "b", label: "B", defineName: "ROTARY_ENCODER_B_GPIO", defaultsByModule: defaultsFor(bGpio) },
      { key: "button", label: "Button", defineName: "ROTARY_ENCODER_BUTTON_GPIO", defaultsByModule: defaultsFor(buttonGpio) },
    ],
  };
}

function findDeviceType(id) {
  return DEVICE_TYPES.find((d) => d.id === id) || null;
}

// Looks up a component (sensor chip, and eventually light-source parts
// like relays/LEDs) from the shared COMPONENT_LIBRARY by id, merging the
// id itself into the returned object for convenience at call sites.
function findComponent(id) {
  const c = COMPONENT_LIBRARY[id];
  return c ? { id, ...c } : null;
}

/* --- clusterOptions / chipChoiceGroups shared helpers ------------------
 * See the DEVICE_TYPES comment on air-quality's own clusterOptions entry
 * for the full mechanism description. These three functions are the
 * single source of truth every one of renderConfigureDevice/
 * isProductComplete/buildSedCommands/renderCustomiseReview builds on, so
 * "which chip backs this cluster" and "is this chip currently enabled"
 * can never disagree between them. */

// Resolves which COMPONENT_LIBRARY chip currently backs one clusterOptions
// entry — either its own fixed `chip`, or (for a `group` entry) whichever
// chip is currently chosen in p.chipChoices, defaulting to the group's
// own first option the same way componentOptions/extraPickers already
// default an unset selection.
function clusterBackingChip(deviceType, p, cluster) {
  if (cluster.chip) return findComponent(cluster.chip);
  const group = (deviceType.chipChoiceGroups || []).find((g) => g.key === cluster.group);
  if (!group) return null;
  const chosenId = (p.chipChoices && p.chipChoices[cluster.group]) || group.chips[0];
  return findComponent(chosenId);
}

// A chip is enabled exactly when at least one clusterOptions entry that
// currently resolves to it is checked in p.enabledClusters — DERIVED,
// never stored separately, so it can never drift out of sync with the
// checkboxes themselves.
function chipIsEnabledForClusters(deviceType, p, chipId) {
  return (deviceType.clusterOptions || []).some((cluster) =>
    !!(p.enabledClusters && p.enabledClusters[cluster.id]) &&
    (clusterBackingChip(deviceType, p, cluster) || {}).id === chipId);
}

// Every cluster id that would need to be (re-)checked if `chipId` is the
// backing chip for `cluster` and gets enabled — for a chip backing more
// than one cluster (currently just PMS5003's PM1/PM2.5/PM10 trio), this
// is every clusterOptions entry currently resolving to that same chip,
// not just the one the user actually clicked (see the DEVICE_TYPES
// comment above for why that's a correctness requirement, not just UX).
function clusterIdsBackedByChip(deviceType, p, chipId) {
  return (deviceType.clusterOptions || [])
    .filter((cluster) => (clusterBackingChip(deviceType, p, cluster) || {}).id === chipId)
    .map((cluster) => cluster.id);
}

const state = {
  screen: "dashboard", // "dashboard" | "setup" | "wizard"
  products: loadProducts(),
  currentProduct: null,
};

function loadProducts() {
  try {
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    // Migrate products saved before device types were generalised: the LED
    // GPIO field used to be called ledGpio specifically.
    products.forEach((p) => {
      if (p.gpioPin == null && p.ledGpio != null) p.gpioPin = p.ledGpio;
    });
    return products;
  } catch (e) {
    return [];
  }
}

function saveProducts() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.products));
}

function goTo(screen) {
  state.screen = screen;
  render();
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "dashboard") app.innerHTML = renderDashboard();
  else if (state.screen === "setup") app.innerHTML = renderSetup();
  else if (state.screen === "wizard") app.innerHTML = renderWizard();
  bindEvents();
}

/* ---------- Dashboard ---------- */

function renderDashboard() {
  const cards = state.products
    .map(
      (p) => `
      <div class="product-card" data-open-product="${p.id}">
        <button class="delete-btn" data-delete-product="${p.id}" title="Delete product" aria-label="Delete ${escapeHtml(p.name)}">&times;</button>
        <h3>${escapeHtml(p.name)}</h3>
        <div class="meta">
          ${moduleName(p.target) !== "—" ? escapeHtml(moduleName(p.target)) + " · " : ""}Step: ${WIZARD_STEPS[p.step]}
        </div>
      </div>`
    )
    .join("");

  const grid = state.products.length
    ? `<div class="product-grid">${cards}</div>`
    : `<div class="empty-state">No products yet. Create your first one to get started.</div>`;

  return `
    <div class="dashboard-head">
      <div>
        <h1>Your products</h1>
        <p>Configure Matter devices for the esp32-matter toolkit — everything stays on this machine.</p>
      </div>
      <button class="primary" id="create-product-btn">+ Create a new product</button>
    </div>
    ${grid}
  `;
}

  "microwave-oven": `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="40" height="28" rx="4"/>
    <rect x="8" y="14" width="26" height="20" rx="2"/>
    <path d="M13 20q3-4 6 0t6 0t6 0" stroke-width="2"/>
    <path d="M13 27q3-4 6 0t6 0t6 0" stroke-width="2"/>
    <circle cx="39" cy="19" r="1.8" fill="currentColor" stroke="none"/>
    <circle cx="39" cy="27" r="1.8" fill="currentColor" stroke="none"/>
  </svg>`,
  // A wall-mounted doorbell plate (rounded rect) with a filled circular
  // pushbutton — the real, physical thing this device type is. Distinct
  // from generic-switch's own bare button-bezel-plus-ticks motif (that
  // icon is a standalone smart button, this one is specifically a
  // doorbell fixture) and from chime's own bell-shaped icon below (this
  // device sends the command, chime receives it).
  doorbell: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="4" width="24" height="40" rx="5"/>
    <circle cx="24" cy="22" r="7" fill="currentColor" stroke="none"/>
  </svg>`,
  // A classic bell silhouette with two small sound-wave ticks beside it —
  // the standard "chime/ring" pictogram, distinct from doorbell's own
  // wall-plate-and-button fixture shape (this device receives the command
  // and makes the actual sound).
  chime: `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 8c-6 0-9 5-9 11v6l-3 6h24l-3-6v-6c0-6-3-11-9-11Z"/>
    <path d="M20 35a4 4 0 0 0 8 0"/>
    <path d="M38 16q3 4 3 8t-3 8" stroke-width="2"/>
    <path d="M8 16q-3 4-3 8t3 8" stroke-width="2"/>
  </svg>`,
  // A pop-up sprinkler head (a small body on the ground line with a
  // vertical riser) spraying two curved water arcs — the standard garden-
  // irrigation pictogram, distinct from flow-sensor's own in-line-pipe-

  // in-line flow meter) and from valve's own pipe-TEE-with-handle shape.
  "irrigation-system": `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 38h36" stroke-width="2"/>
    <rect x="19" y="30" width="10" height="8" rx="2"/>
    <path d="M24 30v-8"/>
    <path d="M24 22q9-7 16 2" stroke-width="2"/>
    <path d="M24 22q-9-7-16 2" stroke-width="2"/>
  </svg>`,
  // A utility-meter dial face (circle + a single sweeping needle) — the
  // classic analog power-meter pictogram, distinct from outlet's own
  // bare-circle-plus-dots plug motif and from pressure-sensor's own gauge
  // (needle here reads a fixed "mid-scale" angle, not evocative of a
  // pressure gauge's own full sweep range).
  "electrical-meter": `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="17"/>
    <path d="M24 24l8-8" stroke-width="3"/>
    <circle cx="24" cy="24" r="2.5" fill="currentColor" stroke="none"/>
  </svg>`,
  // A rotary knob (circle with a pointer tick) above a small pushbutton
  // bar — the two real controls this device actually has (turn to dim,
  // press to toggle), distinct from generic-switch's own plain button
  // and from dimmable-light's own bulb-plus-slider (this icon shows the
  // physical remote control itself, not the light it controls).
  "dimmer-switch": `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="18" r="11"/>

  </svg>`,
  // Two rotary knobs side by side (each with its own pointer tick) above
  // a small pushbutton bar — the same "physical remote" framing as
  // dimmer-switch's own icon, with a second knob standing in for the
  // added hue control (this device's one real difference).
  "color-dimmer-switch": `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="16" r="8"/>
    <path d="M15 16V9"/>

    <path d="M33 16V9"/>

};

// `title` becomes each badge's hover tooltip. `zigbee`'s tooltip carries
// the "hardware-capable, not actually built here" caveat since the visible
// label is just "Zigbee" — these chips' 802.15.4 radio can physically run
// Zigbee, but this repo/wizard only ever builds Matter firmware for it (via
// esp-matter, Matter-over-Thread), never Zigbee firmware. The muted/lower-
// opacity styling (see .conn-badge.zigbee below) is what visually
// distinguishes it from the transports this repo actually builds.
// Not user-facing text data like CONN_LABELS below — a single constant so
// the "Matter" badge's label only needs updating in one place.
const MATTER_BADGE_LABEL = "Matter";

const CONN_LABELS = {
  wifi: { label: "Wi-Fi", title: "Wi-Fi station — this repo's WiFi devices connect to your existing network." },
  ble: { label: "BLE", title: "Bluetooth Low Energy — used for the initial Matter commissioning handshake." },
  thread: { label: "Thread", title: "802.15.4 radio running Matter-over-Thread — needs a Thread Border Router on your network." },
  zigbee: { label: "Zigbee", title: "The 802.15.4 radio can physically run Zigbee, but this repo only ever builds Matter firmware for it — never Zigbee." },
};

function renderWizard() {
  const p = state.currentProduct;
  const stepsHtml = WIZARD_STEPS.map((label, i) => {
    const cls = i < p.step ? "done" : i === p.step ? "active" : "";
    const marker = i < p.step ? "&#10003;" : i + 1;
    const sep = i < WIZARD_STEPS.length - 1 ? `<span class="step-sep">&rsaquo;</span>` : "";
    return `<div class="step ${cls}"><span class="dot">${marker}</span>${escapeHtml(label)}</div>${sep}`;
  }).join("");

  let content;
  if (p.step === 0) content = renderGetStarted(p);
  else if (p.step === 1) content = renderSelectModule(p);
  else if (p.step === 2) content = renderConfigureDevice(p);
  else if (p.step === 3) content = renderTestProduct(p);
  else if (p.step === 4) content = renderCustomiseReview(p);
  else if (p.step === 5) content = renderGenerateFirmware(p);
  else content = `<div class="wizard-panel"><p>Unknown step.</p></div>`;

  return `<div class="stepper">${stepsHtml}</div>${content}`;
}

function renderGetStarted(p) {
  // Auto-select the only device type there is today — future types will
  // require an explicit click once DEVICE_TYPES has more than one entry.
  if (!p.deviceType && DEVICE_TYPES.length === 1) p.deviceType = DEVICE_TYPES[0].id;

  const cards = DEVICE_TYPES.map((d) => {
    const selected = p.deviceType === d.id;
    const icon = DEVICE_TYPE_ICONS[d.id] || "";
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-device-type="${d.id}" title="${escapeHtml(d.desc)}">
        <div class="device-icon" aria-hidden="true">${icon}</div>
        <h3>${escapeHtml(d.name)}</h3>
        <p class="desc">${escapeHtml(d.shortDesc || d.desc)}</p>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose your device</h2>
      <p class="step-hint">What kind of Matter device is "${escapeHtml(p.name)}"?</p>
      <div class="option-grid">${cards}</div>
      <p class="note-box">
        Every option above maps to a real, buildable folder under
        <code>firmware/</code> — none of these are UI placeholders. Adding
        another device type means copying one of those folders and
        swapping its endpoint type, per CLAUDE.md.
      </p>
      ${renderWizardFooter(p, !!p.deviceType)}
    </div>
  `;
}

function renderSelectModule(p) {
  const cards = MODULES.map((m) => {
    const selected = p.target === m.id;
    // "Matter" isn't part of `conn` — every module listed in this wizard is
    // Matter-capable by definition (that's the entire point of the repo),
    // so it's always shown first rather than repeated in every entry's conn
    // array.
    const matterBadge = `<span class="conn-badge matter" title="This module builds and runs Matter firmware.">${escapeHtml(MATTER_BADGE_LABEL)}</span>`;
    const badges = m.conn
      .map((c) => `<span class="conn-badge ${c}" title="${escapeHtml(CONN_LABELS[c].title)}">${escapeHtml(CONN_LABELS[c].label)}</span>`)
      .join("");
    // See the comment on MODULES itself for why this is a relative <img>
    // src rather than an inlined string the way DEVICE_TYPE_ICONS is.
    const icon = m.icon
      ? `<div class="module-icon"><img src="../../modules/${encodeURIComponent(m.icon)}" alt="" aria-hidden="true"></div>`
      : "";
    return `
      <button class="option-card ${selected ? "selected" : ""}" data-select-module="${m.id}">
        ${icon}
        <h3>${escapeHtml(m.name)}</h3>
        <p class="desc">${escapeHtml(m.desc)}</p>
        <div class="badge-row">${matterBadge}${badges}</div>
      </button>`;
  }).join("");

  return `
    <div class="step-panel">
      <h2>Choose an ESP module</h2>
      <p class="step-hint">Which chip will "${escapeHtml(p.name)}" run on? This maps to <code>idf.py set-target</code>.</p>
      <div class="option-grid">${cards}</div>
      ${renderWizardFooter(p, !!p.target)}
    </div>
  `;
}

// Old saved products predate this field entirely, so "enabled" has to be
// the default for undefined too — only an explicit false means off.
function identifyIsEnabled(p) {
  return p.identifyEnabled !== false;
}

// Status LED (currently outlet-only): opposite default from Identify above
// — off unless explicitly turned on — since not every board has this
// separate on/off indicator LED wired up at all, unlike Identify which
// every device type ships with.
function statusLedIsEnabled(p) {
  return p.statusLedEnabled === true;
}

// Door lock's optional position sensor (firmware/door-lock/ only) — same
// single-GPIO, off-by-default, checkbox-gated shape as statusLed above,
// deliberately duplicated (not reused as the literal statusLed field)
// since its own checkbox/description text is genuinely different
// wording (a sensor INPUT confirming real bolt position, not an output
// LED) — reusing statusLed verbatim would render "Add a Status LED" for
// a feature that isn't an LED at all.
function positionSensorIsEnabled(p) {
  return p.positionSensorEnabled === true;
}

// Robot vacuum's optional dock-contact sensor (firmware/robot-vacuum/
// only) — same single-GPIO, off-by-default, checkbox-gated shape as
// statusLed/positionSensor above, deliberately duplicated for the same
// reason positionSensor itself was: its own checkbox/description text
// (a charging-dock contact, not an on/off-mirroring LED or a bolt-
// position sensor) is genuinely different wording from either.
function dockSensorIsEnabled(p) {
  return p.dockSensorEnabled === true;
}

// EVSE's optional plug-detect sensor (firmware/evse/ only) — same
// single-GPIO, off-by-default, checkbox-gated shape as statusLed/
// positionSensor/dockSensor above, deliberately duplicated for the same
// reason each of those was: its own checkbox/description text (an EV
// "vehicle connected" signal) is genuinely different wording from any of
// the other three.
function plugSensorIsEnabled(p) {
  return p.plugSensorEnabled === true;
}

// Rotary encoder (firmware/thermostat/ only, so far) — same off-by-default
// shape as statusLed/positionSensor/dockSensor/plugSensor above,
// deliberately parallel rather than sharing its render code (see
// makeRotaryEncoder()'s own comment for why).
function rotaryEncoderIsEnabled(p) {
  return p.rotaryEncoderEnabled === true;
}

function renderConfigureDevice(p) {
  const deviceType = findDeviceType(p.deviceType);
  const driver = deviceType ? deviceType.driver : null;
  const secondary = deviceType ? deviceType.secondary : null;
  const identify = deviceType ? deviceType.identify : null;
  const statusLed = deviceType ? deviceType.statusLed : null;
  const positionSensor = deviceType ? deviceType.positionSensor : null;
  const dockSensor = deviceType ? deviceType.dockSensor : null;
  const plugSensor = deviceType ? deviceType.plugSensor : null;
  const rotaryEncoder = deviceType ? deviceType.rotaryEncoder : null;
  const componentOptions = deviceType ? deviceType.componentOptions : null;
  const extraButtons = deviceType ? deviceType.extraButtons : null;
  const extraPickers = deviceType ? deviceType.extraPickers : null;
  const clusterOptions = deviceType ? deviceType.clusterOptions : null;
  let numberField = deviceType ? deviceType.numberField : null;
  const defaultGpio = driver ? (driver.defaultsByModule[p.target] != null ? driver.defaultsByModule[p.target] : 2) : 2;
  const defaultSecondaryGpio = secondary ? (secondary.defaultsByModule[p.target] != null ? secondary.defaultsByModule[p.target] : 4) : 4;
  const defaultIdentifyGpio = identify ? (identify.defaultsByModule[p.target] != null ? identify.defaultsByModule[p.target] : 4) : 4;
  const identifyOn = identifyIsEnabled(p);
  const defaultStatusLedGpio = statusLed ? (statusLed.defaultsByModule[p.target] != null ? statusLed.defaultsByModule[p.target] : 5) : 5;
  const statusLedOn = statusLed ? statusLedIsEnabled(p) : false;
  const defaultPositionSensorGpio = positionSensor ? (positionSensor.defaultsByModule[p.target] != null ? positionSensor.defaultsByModule[p.target] : 16) : 16;
  const positionSensorOn = positionSensor ? positionSensorIsEnabled(p) : false;
  const defaultDockSensorGpio = dockSensor ? (dockSensor.defaultsByModule[p.target] != null ? dockSensor.defaultsByModule[p.target] : 32) : 32;
  const dockSensorOn = dockSensor ? dockSensorIsEnabled(p) : false;
  const defaultPlugSensorGpio = plugSensor ? (plugSensor.defaultsByModule[p.target] != null ? plugSensor.defaultsByModule[p.target] : 16) : 16;
  const plugSensorOn = plugSensor ? plugSensorIsEnabled(p) : false;
  const rotaryEncoderOn = rotaryEncoder ? rotaryEncoderIsEnabled(p) : false;
  if (rotaryEncoder) {
    if (typeof p.rotaryEncoderPins !== "object" || p.rotaryEncoderPins == null) p.rotaryEncoderPins = {};
    rotaryEncoder.pins.forEach((pin) => {
      if (p.rotaryEncoderPins[pin.defineName] == null) {
        p.rotaryEncoderPins[pin.defineName] = pin.defaultsByModule[p.target] != null ? pin.defaultsByModule[p.target] : 0;
      }
    });
  }
  const rotaryEncoderValid = !rotaryEncoderOn || rotaryEncoder.pins.every((pin) =>
    Number.isInteger(p.rotaryEncoderPins[pin.defineName]) && p.rotaryEncoderPins[pin.defineName] >= 0);

  if (componentOptions && p.component == null) p.component = componentOptions[0];
  const selectedComponent = componentOptions ? (findComponent(p.component) || findComponent(componentOptions[0])) : null;
  // Some componentOptions chips (currently just addressable-light's
  // SM2335EGH) have no pixel-chain concept at all — hidesNumberField on
  // the selected component's own COMPONENT_LIBRARY entry suppresses the
  // numberField the device type would otherwise show, same as any other
  // "this device type has one, but this chip doesn't use it" case
  // elsewhere in this file (e.g. usesPin2: false hiding the pin2 field).
  if (selectedComponent && selectedComponent.hidesNumberField) numberField = null;

  // extraPickers (currently just the outlet's Output-type + Power-Monitoring
  // chip choices): a list of independent enum-like pickers, each keyed by
  // its own state field (picker.key) rather than the single shared
  // p.component componentOptions uses — deliberately separate from
  // componentOptions since these choices don't drive driverLabel/
  // secondaryFieldNeeded pin-naming the way a sensor-model choice does.
  // A selected component can also carry its own `pins` array (currently
  // just the power-monitor chips) — those get defaulted into
  // p.pickerPins, keyed by each pin's defineName (globally unique across
  // chips, since HLW8012/CSE7759 intentionally share BL0937's
  // PULSE_METER_* names — see the comment in COMPONENT_LIBRARY).
  if (extraPickers) {
    if (typeof p.pickerPins !== "object" || p.pickerPins == null) p.pickerPins = {};
    extraPickers.forEach((picker) => {
      if (p[picker.key] == null) p[picker.key] = picker.options[0];
      const selected = findComponent(p[picker.key]);
      if (selected && Array.isArray(selected.pins)) {
        selected.pins.forEach((pin) => {
          if (p.pickerPins[pin.defineName] == null) {
            p.pickerPins[pin.defineName] = pin.defaultsByModule[p.target] != null ? pin.defaultsByModule[p.target] : 0;
          }
        });
      }
    });
  }
  // Every pin field currently active across all extraPickers (e.g. both of
  // BL0942's UART pins, or ADE7953's SDA/SCL) — flattened once so
  // rendering/validation/summary don't each need their own copy of this walk.
  const activePickerPins = extraPickers
    ? extraPickers.flatMap((picker) => {
        const selected = findComponent(p[picker.key]);
        return selected && Array.isArray(selected.pins) ? selected.pins.map((pin) => ({ picker, pin })) : [];
      })
    : [];
  const pickerPinsValid = activePickerPins.every(({ pin }) =>
    Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);

  // clusterOptions (currently just air-quality's own optional-cluster
  // checkboxes) — default p.enabledClusters to "everything unchecked"
  // (unlike componentOptions/extraPickers, nothing here is required, so
  // there's no "first option" to default-select), then default-fill
  // p.pickerPins for whichever chips are CURRENTLY enabled — same shared
  // pickerPins object extraPickers already uses (deliberately reused, not
  // a second parallel pins store, since a GPIO field behaves identically
  // either way it got enabled).
  if (clusterOptions) {
    if (typeof p.enabledClusters !== "object" || p.enabledClusters == null) p.enabledClusters = {};
    if (typeof p.chipChoices !== "object" || p.chipChoices == null) p.chipChoices = {};
    if (typeof p.pickerPins !== "object" || p.pickerPins == null) p.pickerPins = {};
    (deviceType.chipChoiceGroups || []).forEach((group) => {
      if (p.chipChoices[group.key] == null) p.chipChoices[group.key] = group.chips[0];
    });
    COMPONENT_LIBRARY && Object.keys(COMPONENT_LIBRARY).forEach((chipId) => {
      if (!chipIsEnabledForClusters(deviceType, p, chipId)) return;
      const chip = findComponent(chipId);
      if (chip && Array.isArray(chip.pins)) {
        chip.pins.forEach((pin) => {
          if (p.pickerPins[pin.defineName] == null) {
            p.pickerPins[pin.defineName] = pin.defaultsByModule[p.target] != null ? pin.defaultsByModule[p.target] : 0;
          }
        });
      }
    });
  }
  // Every pin field currently active across all enabled cluster chips —
  // same "flatten once" shape activePickerPins uses above.
  const activeClusterChipPins = clusterOptions
    ? Object.keys(COMPONENT_LIBRARY)
        .filter((chipId) => chipIsEnabledForClusters(deviceType, p, chipId))
        .flatMap((chipId) => {
          const chip = findComponent(chipId);
          return chip && Array.isArray(chip.pins) ? chip.pins.map((pin) => ({ chip, pin })) : [];
        })
    : [];
  const clusterChipPinsValid = activeClusterChipPins.every(({ pin }) =>
    Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);
  const chipChoiceGroupsValid = !clusterOptions || (deviceType.chipChoiceGroups || []).every((group) => {
    const groupInUse = clusterOptions.some((c) => c.group === group.key && p.enabledClusters[c.id]);
    return !groupInUse || !!p.chipChoices[group.key];
  });

  // Multi-button (currently just the switch): button 1 is always the
  // existing `driver` field, unchanged, so single-button products (every
  // switch created before this feature existed) keep working with zero
  // migration. Buttons 2+ are extraButtons, shown/sed'd up to whatever
  // buttonCount is set to (1 = just button 1, same as before this feature
  // existed at all).
  // A device type can use `extraButtons` two ways: a real variable count
  // the user picks (switch's 1-4 buttons — has `buttonCountDefineName`,
  // so the count gets its own sed line), or a fixed set of GPIO fields
  // that are just always all shown/sed'd (e.g. firmware/color-light/'s
  // Green/Blue channels alongside `driver`'s Red — there's no real "how
  // many" choice, it's always all of them). No `buttonCountDefineName`
  // on the device type is the signal for the fixed case.
  const maxButtons = extraButtons ? extraButtons.length + 1 : 1;
  const hasVariableButtonCount = extraButtons && !!(deviceType && deviceType.buttonCountDefineName);
  if (extraButtons) {
    if (hasVariableButtonCount) {
      if (!Number.isInteger(p.buttonCount) || p.buttonCount < 1 || p.buttonCount > maxButtons) p.buttonCount = 1;
    } else {
      p.buttonCount = maxButtons;
    }
    if (!Array.isArray(p.buttonGpios)) p.buttonGpios = [];
  }
  const buttonCount = extraButtons ? p.buttonCount : 1;
  const activeExtraButtons = extraButtons ? extraButtons.slice(0, buttonCount - 1) : [];
  activeExtraButtons.forEach((b, i) => {
    if (p.buttonGpios[i] == null) {
      p.buttonGpios[i] = b.defaultsByModule[p.target] != null ? b.defaultsByModule[p.target] : b.currentGpio;
    }
  });
  const extraButtonsValid = activeExtraButtons.every((b, i) => Number.isInteger(p.buttonGpios[i]) && p.buttonGpios[i] >= 0);

  if (p.gpioPin == null) p.gpioPin = defaultGpio;
  if (secondary && p.secondaryGpioPin == null) p.secondaryGpioPin = defaultSecondaryGpio;
  if (p.identifyGpioPin == null) p.identifyGpioPin = defaultIdentifyGpio;
  const gpioValid = Number.isInteger(p.gpioPin) && p.gpioPin >= 0;
  const secondaryGpioValid = !secondary || (Number.isInteger(p.secondaryGpioPin) && p.secondaryGpioPin >= 0);
  const identifyGpioValid = !identifyOn || (Number.isInteger(p.identifyGpioPin) && p.identifyGpioPin >= 0);
  const sameGpio = identifyOn && gpioValid && identifyGpioValid && p.gpioPin === p.identifyGpioPin;
  if (statusLed && p.statusLedGpioPin == null) p.statusLedGpioPin = defaultStatusLedGpio;
  const statusLedGpioValid = !statusLedOn || (Number.isInteger(p.statusLedGpioPin) && p.statusLedGpioPin >= 0);
  if (positionSensor && p.positionSensorGpioPin == null) p.positionSensorGpioPin = defaultPositionSensorGpio;
  const positionSensorGpioValid = !positionSensorOn || (Number.isInteger(p.positionSensorGpioPin) && p.positionSensorGpioPin >= 0);
  if (dockSensor && p.dockSensorGpioPin == null) p.dockSensorGpioPin = defaultDockSensorGpio;
  const dockSensorGpioValid = !dockSensorOn || (Number.isInteger(p.dockSensorGpioPin) && p.dockSensorGpioPin >= 0);
  if (plugSensor && p.plugSensorGpioPin == null) p.plugSensorGpioPin = defaultPlugSensorGpio;
  const plugSensorGpioValid = !plugSensorOn || (Number.isInteger(p.plugSensorGpioPin) && p.plugSensorGpioPin >= 0);
  // numberField (currently just the addressable light's pixel count): a
  // plain integer #define, not a GPIO — validated against its own
  // min/max rather than the GPIO fields' "0 or higher" rule.
  if (numberField && p[numberField.key] == null) p[numberField.key] = numberField.defaultValue;
  const numberFieldValid = !numberField ||
    (Number.isInteger(p[numberField.key]) && p[numberField.key] >= numberField.min && p[numberField.key] <= numberField.max);
  const allValid = gpioValid && secondaryGpioValid && identifyGpioValid && extraButtonsValid && statusLedGpioValid && positionSensorGpioValid && dockSensorGpioValid && plugSensorGpioValid && pickerPinsValid && numberFieldValid && rotaryEncoderValid;

  // Component-aware field labels: falls back to the device type's own
  // static text when there's no componentOptions list (every device type
  // except the temperature sensor, for now) so this doesn't change
  // anything for the others.
  const driverLabel = selectedComponent ? `${selectedComponent.pin1Label} GPIO pin` : (driver ? driver.fieldLabel : "GPIO pin");
  const driverBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin1Label}` : (driver ? driver.blockTitle : "GPIO");
  const secondaryLabel = selectedComponent ? `${selectedComponent.pin2Label || "Pin 2"} GPIO pin` : (secondary ? secondary.fieldLabel : "");
  const secondaryBlockTitle = selectedComponent ? `${selectedComponent.name} · ${selectedComponent.pin2Label || "pin 2"}` : (secondary ? secondary.blockTitle : "");

        <button class="link" id="serial-clear-btn">Clear log</button>

/* Web Serial connection — deliberately kept outside the render/state cycle.
 * A full re-render would tear down and recreate the <pre> log element and
 * sever the read loop's reference to it, so connect/disconnect/log updates
 * touch the DOM directly instead of going through render(). */
const serialState = {
  supported: !!(navigator.serial),
  port: null,
  reader: null,
  connected: false,
};

async function connectSerial() {
  try {
    const port = await navigator.serial.requestPort();
    const baudSelect = document.getElementById("serial-baud");
    const baudRate = baudSelect ? parseInt(baudSelect.value, 10) : 115200;
    await port.open({ baudRate });
    serialState.port = port;
    serialState.connected = true;
    updateSerialUI();
    readSerialLoop(port);
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  }
}

async function readSerialLoop(port) {
  const decoder = new TextDecoderStream();
  const streamClosed = port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = decoder.readable.getReader();
  serialState.reader = reader;
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value) appendSerialLog(value);
    }
  } catch (err) {
    appendSerialLog(`\n[error] ${err.message}\n`);
  } finally {
    reader.releaseLock();
    await streamClosed;
  }
}

async function disconnectSerial() {
  try {
    if (serialState.reader) await serialState.reader.cancel();
    if (serialState.port) await serialState.port.close();
  } catch (err) {
    // Port may already be gone (device unplugged) — nothing to do.
  }
  serialState.port = null;
  serialState.reader = null;
  serialState.connected = false;
  updateSerialUI();
}

function appendSerialLog(text) {
  const log = document.getElementById("serial-log");
  if (!log) return;
  log.textContent += text;
  log.scrollTop = log.scrollHeight;
}

function updateSerialUI() {
  const btn = document.getElementById("serial-connect-btn");
  const status = document.getElementById("serial-status");
  if (!btn || !status) return;
  btn.textContent = serialState.connected ? "Disconnect" : "Connect";
  status.textContent = serialState.connected ? "Connected" : "Not connected";
  status.classList.toggle("connected", serialState.connected);
}

/* Selection completeness, shared by Customise & Review and Generate
 * Firmware so they can't drift apart. */
function isProductComplete(p) {
  const deviceType = findDeviceType(p.deviceType);
  const identifyOk = !identifyIsEnabled(p) ||
    (Number.isInteger(p.identifyGpioPin) && p.identifyGpioPin >= 0);
  const secondaryOk = !(deviceType && deviceType.secondary) ||
    (Number.isInteger(p.secondaryGpioPin) && p.secondaryGpioPin >= 0);
  // Multi-button devices (currently just the switch): every button GPIO up
  // to the selected buttonCount has to be valid too — buttonCount itself
  // defaults to 1 (just the always-present `driver` field) whenever the
  // device type doesn't define extraButtons at all. Fixed-count devices
  // (extraButtons present but no buttonCountDefineName — see the comment
  // on hasVariableButtonCount in renderConfigureDevice, e.g.
  // firmware/color-light/'s Green/Blue channels) always need every field
  // valid, not just the first — computed independently here (not read
  // from p.buttonCount) so this validates correctly even if
  // renderConfigureDevice() hasn't run yet to default-fill it.
  const extraButtons = deviceType ? deviceType.extraButtons : null;
  const hasVariableButtonCount = extraButtons && !!(deviceType && deviceType.buttonCountDefineName);
  const maxButtons = extraButtons ? extraButtons.length + 1 : 1;
  const buttonCount = extraButtons
    ? (hasVariableButtonCount ? (Number.isInteger(p.buttonCount) ? p.buttonCount : 1) : maxButtons)
    : 1;
  const buttonsOk = !extraButtons || extraButtons.slice(0, buttonCount - 1).every((b, i) =>
    Array.isArray(p.buttonGpios) && Number.isInteger(p.buttonGpios[i]) && p.buttonGpios[i] >= 0);
  const statusLedOk = !(deviceType && deviceType.statusLed) || !statusLedIsEnabled(p) ||
    (Number.isInteger(p.statusLedGpioPin) && p.statusLedGpioPin >= 0);
  const positionSensorOk = !(deviceType && deviceType.positionSensor) || !positionSensorIsEnabled(p) ||
    (Number.isInteger(p.positionSensorGpioPin) && p.positionSensorGpioPin >= 0);
  const dockSensorOk = !(deviceType && deviceType.dockSensor) || !dockSensorIsEnabled(p) ||
    (Number.isInteger(p.dockSensorGpioPin) && p.dockSensorGpioPin >= 0);
  const plugSensorOk = !(deviceType && deviceType.plugSensor) || !plugSensorIsEnabled(p) ||
    (Number.isInteger(p.plugSensorGpioPin) && p.plugSensorGpioPin >= 0);
  const rotaryEncoder = deviceType ? deviceType.rotaryEncoder : null;
  const rotaryEncoderOk = !rotaryEncoder || !rotaryEncoderIsEnabled(p) ||
    rotaryEncoder.pins.every((pin) =>
      p.rotaryEncoderPins && Number.isInteger(p.rotaryEncoderPins[pin.defineName]) && p.rotaryEncoderPins[pin.defineName] >= 0);
  // Pins belonging to whichever component is currently selected on each
  // extraPicker (currently just the outlet's Power Monitoring chip) —
  // same "active selection only" shape as buttonsOk above.
  const extraPickers = deviceType ? deviceType.extraPickers : null;
  const pickerPinsOk = !extraPickers || extraPickers.every((picker) => {
    const selected = findComponent(p[picker.key]);
    if (!selected || !Array.isArray(selected.pins)) return true;
    return selected.pins.every((pin) =>
      p.pickerPins && Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);
  });
  // numberField (currently just the addressable light's pixel count) —
  // computed independently here too, same "don't trust p[...] being
  // pre-filled" reasoning as buttonCount/hasVariableButtonCount above,
  // since this can be called before renderConfigureDevice ever has.
  const componentOptions = deviceType ? deviceType.componentOptions : null;
  const selectedComponent = componentOptions ? (findComponent(p.component) || findComponent(componentOptions[0])) : null;
  // hidesNumberField (currently just addressable-light's SM2335EGH — see
  // the same check in renderConfigureDevice) — a hidden field is never
  // required, same as any other conditionally-shown field here.
  const numberField = (deviceType && deviceType.numberField && !(selectedComponent && selectedComponent.hidesNumberField))
    ? deviceType.numberField : null;
  const numberFieldOk = !numberField ||
    (Number.isInteger(p[numberField.key]) && p[numberField.key] >= numberField.min && p[numberField.key] <= numberField.max);
  // clusterOptions (currently just air-quality's own optional-cluster
  // checkboxes) — same "compute fresh, don't trust p[...] being pre-
  // filled" reasoning as buttonCount/numberField above. Uses the shared
  // clusterBackingChip()/chipIsEnabledForClusters() helpers directly
  // (both already tolerate p.enabledClusters/p.chipChoices being unset),
  // so this validates correctly even before renderConfigureDevice() has
  // ever run to default-fill p.pickerPins for a newly-checked chip.
  const clusterOptions = deviceType ? deviceType.clusterOptions : null;
  const clusterChipPinsOk = !clusterOptions || Object.keys(COMPONENT_LIBRARY)
    .filter((chipId) => chipIsEnabledForClusters(deviceType, p, chipId))
    .every((chipId) => {
      const chip = findComponent(chipId);
      if (!chip || !Array.isArray(chip.pins)) return true;
      return chip.pins.every((pin) =>
        p.pickerPins && Number.isInteger(p.pickerPins[pin.defineName]) && p.pickerPins[pin.defineName] >= 0);
    });
  const chipChoiceGroupsOk = !clusterOptions || (deviceType.chipChoiceGroups || []).every((group) => {
    const groupInUse = clusterOptions.some((c) => c.group === group.key && p.enabledClusters && p.enabledClusters[c.id]);
    return !groupInUse || !!(p.chipChoices && p.chipChoices[group.key]);
  });
  return !!p.deviceType && !!p.target &&
    Number.isInteger(p.gpioPin) && p.gpioPin >= 0 &&
    secondaryOk && identifyOk && buttonsOk && statusLedOk && positionSensorOk && dockSensorOk && plugSensorOk &&
    rotaryEncoderOk && pickerPinsOk && numberFieldOk && clusterChipPinsOk && chipChoiceGroupsOk;
}

              <div class="summary-value">${plugSensorIsEnabled(p) ? `GPIO ${p.plugSensorGpioPin != null ? p.plugSensorGpioPin : "?"}` : "Not added"}</div>
            </div>
            <button class="link" data-goto-step="2">Edit</button>
          </div>
        ` : ""}
        ${(() => {
          const dt = findDeviceType(p.deviceType);
          if (!dt || !dt.rotaryEncoder) return "";
          const on = rotaryEncoderIsEnabled(p);
          return `
            <div class="review-row">
              <div>
                <div class="summary-label">ROTARY ENCODER</div>
                <div class="summary-value">${on
                  ? dt.rotaryEncoder.pins.map((pin) => `${escapeHtml(pin.label)} GPIO ${p.rotaryEncoderPins && p.rotaryEncoderPins[pin.defineName] != null ? p.rotaryEncoderPins[pin.defineName] : "?"}`).join(", ")
                  : "Not added"}</div>
              </div>
              <button class="link" data-goto-step="2">Edit</button>
            </div>
          `;
        })()}
        <div class="review-row">
          <div>
            <div class="summary-label">IDENTIFY LED</div>
            <div class="summary-value">${identifyIsEnabled(p) ? `GPIO ${p.identifyGpioPin != null ? p.identifyGpioPin : "?"}` : "Not added"}</div>
          </div>
          <button class="link" data-goto-step="2">Edit</button>
        </div>
      </div>

      ${complete ? "" : `<div class="warn-box">Some selections are missing — use "Edit" above to go back and complete them.</div>`}

      <h3 style="margin-top:24px;">Generated configuration preview</h3>
      <p class="field-note">
        A preview of the target switch and the commands that edit
        <code>app_main.cpp</code> (run from inside the device's
        <code>firmware/&lt;type&gt;/</code> folder) — Generate Firmware
        (step 6) wraps all of this into one ready-to-run build command.
      </p>

      <div class="code-block-wrap">
        <div class="code-block-label">SET TARGET</div>
        <pre class="code-block">${escapeHtml(setTargetCmd)}</pre>
      </div>
      <div class="code-block-wrap">
        <div class="code-block-label">APP_MAIN.CPP EDITS</div>
        <pre class="code-block">${escapeHtml(sedCommands.join("\n"))}</pre>
      </div>

      <button class="secondary" id="copy-preview-btn">Copy commands</button>
      <span class="copy-feedback" id="copy-feedback"></span>

      ${renderWizardFooter(p, complete)}
    </div>
  `;
}

/* This page always lives at <repo>/tools/product-wizard/index.html when
 * opened the normal way (open tools/product-wizard/index.html). A file://
 * page can't browse your filesystem, but it CAN read its own location — so
 * instead of asking you to type your checkout path, or guessing where you
 * saved a downloaded file, we read it straight out of window.location and
 * bake the real absolute path into the generated command. Returns null if
 * the page isn't being served as file:// from that expected location (e.g.
 * you renamed the folder, or it's running off a web server). */
function detectRepoRoot() {
  if (window.location.protocol !== "file:") return null;
  const marker = "/tools/product-wizard/";
  const path = decodeURIComponent(window.location.pathname);
  const idx = path.indexOf(marker);
  return idx === -1 ? null : path.slice(0, idx);
}
